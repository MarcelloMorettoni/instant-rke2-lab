# Gitea: a small git server with a web console and CI (Gitea Actions), for the
# training lessons. One pod, SQLite, one 2 GiB volume. Lab settings only: plain
# HTTP, sign-up closed, one admin account created by install.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: gitea-data, namespace: gitea}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gitea, namespace: gitea, labels: {app: gitea}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: gitea}}
  template:
    metadata: {labels: {app: gitea}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions: [{key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}]
      securityContext: {fsGroup: 1000}
      containers:
      - name: gitea
        image: gitea/gitea:28.4.0-rootless
        ports: [{containerPort: 3000, name: http}]
        env:
        - {name: GITEA__database__DB_TYPE, value: sqlite3}
        - {name: GITEA__security__INSTALL_LOCK, value: "true"}
        # The address notebooks and CI use. In your browser it is http://localhost:3000 (lab.sh up).
        - {name: GITEA__server__ROOT_URL, value: "http://gitea.gitea.svc.cluster.local:3000/"}
        - {name: GITEA__server__DISABLE_SSH, value: "true"}
        - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
        - {name: GITEA__actions__ENABLED, value: "true"}
        - {name: GITEA__repository__ENABLE_PUSH_CREATE_USER, value: "true"}
        - {name: GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE, value: "false"}
        - {name: GITEA__repository__DEFAULT_BRANCH, value: main}
        readinessProbe: {httpGet: {path: /api/healthz, port: 3000}, periodSeconds: 5}
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
        volumeMounts:
        - {name: data, mountPath: /var/lib/gitea, subPath: data}
        - {name: data, mountPath: /etc/gitea, subPath: config}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: gitea-data}}
---
apiVersion: v1
kind: Service
metadata: {name: gitea, namespace: gitea}
spec:
  selector: {app: gitea}
  ports: [{port: 3000, targetPort: 3000, name: http}]
