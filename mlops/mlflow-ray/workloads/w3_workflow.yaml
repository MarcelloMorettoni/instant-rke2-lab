# W3 on MLflow + Ray: the continuous-training pipeline, orchestrated by Argo
# Workflows (the candidate has no pipeline engine of its own).
#
#   detect new data -> validate -> RayJob (tune, train, evaluate, gate, register)
#                   -> deploy (Ray Serve reconfigure) -> verify the endpoint
#
# The CronWorkflow at the bottom is the retrain trigger: like Kubeflow Pipelines,
# there is no data-event trigger without adding Argo Events.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: w3-ct
  labels: {workflows.argoproj.io/controller-instanceid: mlflow-ray}
spec:
  serviceAccountName: workload
  entrypoint: main
  podGC: {strategy: OnWorkflowCompletion}
  ttlStrategy: {secondsAfterCompletion: 86400}
  templates:
  - name: main
    steps:
    - - name: detect
        template: step
        arguments: {parameters: [{name: cmd, value: detect}]}
    - - name: validate
        template: step
        when: "'{{steps.detect.outputs.parameters.fingerprint}}' != ''"
        arguments: {parameters: [{name: cmd, value: validate}, {name: version, value: "{{steps.detect.outputs.parameters.fingerprint}}"}]}
    - - name: train
        template: rayjob
        when: "'{{steps.detect.outputs.parameters.fingerprint}}' != ''"
        arguments: {parameters: [{name: fingerprint, value: "{{steps.detect.outputs.parameters.fingerprint}}"}]}
    - - name: deploy
        template: deploy
        when: "'{{steps.detect.outputs.parameters.fingerprint}}' != ''"
        arguments: {parameters: [{name: fingerprint, value: "{{steps.detect.outputs.parameters.fingerprint}}"}]}
    - - name: verify
        template: verify
        when: "'{{steps.detect.outputs.parameters.fingerprint}}' != ''"

  # Light steps: a plain container with the test kit mounted.
  - name: step
    inputs: {parameters: [{name: cmd}, {name: version, default: ""}]}
    outputs:
      parameters:
      - {name: fingerprint, valueFrom: {path: /tmp/fingerprint, default: ""}}
    container:
      image: python:3.11-slim
      command: ["bash", "-c"]
      args: ["pip install --quiet --no-cache-dir boto3==1.35.99 pandas==2.2.3 scikit-learn==1.6.1 && python /workloads/w3_steps.py {{inputs.parameters.cmd}}"]
      env: [{name: PYTHONPATH, value: /testkit}, {name: DATA_VERSION, value: "{{inputs.parameters.version}}"}]
      # `data-store` is optional: when a project has it, the data comes from lakeFS.
      envFrom: [{secretRef: {name: s3-client}}, {secretRef: {name: data-store, optional: true}}]
      resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      volumeMounts:
      - {name: testkit, mountPath: /testkit}
      - {name: workloads, mountPath: /workloads}
    volumes: &kit-volumes
    - {name: testkit, configMap: {name: testkit}}
    - {name: workloads, configMap: {name: workloads}}

  # Heavy step: Argo creates a RayJob and waits for it.
  - name: rayjob
    inputs: {parameters: [{name: fingerprint}]}
    resource:
      action: create
      setOwnerReference: true
      successCondition: status.jobStatus == SUCCEEDED
      failureCondition: status.jobStatus == FAILED
      manifest: |
        apiVersion: ray.io/v1
        kind: RayJob
        metadata:
          generateName: w3-train-
        spec:
          entrypoint: python /workloads/w3_ray_train.py
          shutdownAfterJobFinishes: true
          ttlSecondsAfterFinished: 60
          submitterPodTemplate:
            spec:
              restartPolicy: Never
              containers:
              - name: ray-job-submitter
                image: rayproject/ray:2.60.1-py311-cpu
                resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          runtimeEnvYAML: |
            pip: ["mlflow==3.18.0", "scikit-learn==1.6.1", "boto3==1.35.99", "pandas==2.2.3"]
            env_vars:
              PYTHONPATH: /testkit
              GIT_PYTHON_REFRESH: quiet
              DATA_FINGERPRINT: "{{inputs.parameters.fingerprint}}"
              PIPELINE_RUN: "{{workflow.name}}"
          rayClusterSpec:
            rayVersion: "2.60.1"
            headGroupSpec:
              rayStartParams: {num-cpus: "0"}
              template:
                spec:
                  affinity:
                    nodeAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                        - matchExpressions: [{key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}]
                  containers:
                  - name: ray-head
                    image: rayproject/ray:2.60.1-py311-cpu
                    resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 3Gi}}
                    envFrom: [{secretRef: {name: mlflow-client}}, {secretRef: {name: s3-client}}, {secretRef: {name: data-store, optional: true}}]
                    volumeMounts:
                    - {name: testkit, mountPath: /testkit}
                    - {name: workloads, mountPath: /workloads}
                  volumes:
                  - {name: testkit, configMap: {name: testkit}}
                  - {name: workloads, configMap: {name: workloads}}
            workerGroupSpecs:
            - groupName: cpu
              replicas: 2
              minReplicas: 2
              maxReplicas: 2
              rayStartParams: {}
              template:
                spec:
                  containers:
                  - name: ray-worker
                    image: rayproject/ray:2.60.1-py311-cpu
                    resources: {requests: {cpu: "1", memory: 1Gi}, limits: {cpu: "2", memory: 3Gi}}
                    envFrom: [{secretRef: {name: mlflow-client}}, {secretRef: {name: s3-client}}, {secretRef: {name: data-store, optional: true}}]
                    volumeMounts:
                    - {name: testkit, mountPath: /testkit}
                    - {name: workloads, mountPath: /workloads}
                  volumes:
                  - {name: testkit, configMap: {name: testkit}}
                  - {name: workloads, configMap: {name: workloads}}

  # Deploy: bump user_config on the RayService -> in-place reconfigure.
  - name: deploy
    inputs: {parameters: [{name: fingerprint}]}
    container:
      image: alpine/k8s:1.32.3
      command: ["sh", "-c"]
      args:
      - sed "s/MODEL_VERSION_PLACEHOLDER/{{inputs.parameters.fingerprint}}/" /workloads/w3_rayservice.yaml | kubectl apply -f -
      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
      volumeMounts: [{name: workloads, mountPath: /workloads}]
    volumes: *kit-volumes

  # Verify: the endpoint must answer with the champion version.
  - name: verify
    retryStrategy: {limit: 40, backoff: {duration: "15s"}}
    container:
      image: python:3.11-slim
      command: ["bash", "-c"]
      args:
      - |
        pip install --quiet --no-cache-dir requests mlflow-skinny==3.18.0 && python - <<'PY'
        import mlflow, requests, sys
        want = mlflow.MlflowClient().get_model_version_by_alias("sensor-fault", "champion").version
        r = requests.post("http://sensor-fault-serve-svc:8000/", json={"instances": [[0.1, -0.2, 0.3, 0.4]]}, timeout=20)
        print(r.status_code, r.text[:200], "champion:", want)
        sys.exit(0 if r.ok and str(r.json()["model_version"]) == str(want) else 1)
        PY
      env: [{name: GIT_PYTHON_REFRESH, value: quiet}]
      envFrom: [{secretRef: {name: mlflow-client}}]
      resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: w3-ct-every-2min
  labels: {workflows.argoproj.io/controller-instanceid: mlflow-ray}
spec:
  schedules: ["*/2 * * * *"]
  suspend: true          # enabled by the measurement script
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  workflowMetadata:
    labels: {workflows.argoproj.io/controller-instanceid: mlflow-ray}
  workflowSpec:
    workflowTemplateRef: {name: w3-ct}
