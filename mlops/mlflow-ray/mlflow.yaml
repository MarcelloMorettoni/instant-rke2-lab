# MLflow tracking server + model registry, with its two external services:
# PostgreSQL (metadata, and the auth database) and an S3 object store (artifacts).
# Credentials come from the Secret `mlflow-credentials`, created by install-mlflow.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: mlflow}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: mlflow}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        env:
        - {name: POSTGRES_USER, value: mlflow}
        - {name: POSTGRES_DB, value: mlflow}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: mlflow-credentials, key: POSTGRES_PASSWORD}}
        ports: [{containerPort: 5432}]
        readinessProbe: {exec: {command: [pg_isready, -U, mlflow]}, periodSeconds: 5}
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: mlflow}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: s3-data, namespace: mlflow}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
# SeaweedFS in single-binary mode as the S3 endpoint (Apache-2.0).
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3, namespace: mlflow}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: s3}}
  template:
    metadata: {labels: {app: s3}}
    spec:
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:3.97
        # Identities live in the filer (weed shell `s3.configure`, see install-mlflow.sh
        # and tenant.sh). A static -s3.config file would win over them after a restart.
        args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-volume.max=200", "-master.volumeSizeLimitMB=512"]
        ports: [{containerPort: 8333}]
        readinessProbe: {tcpSocket: {port: 8333}, periodSeconds: 5}
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: s3-data}}
---
apiVersion: v1
kind: Service
metadata: {name: s3, namespace: mlflow}
spec: {selector: {app: s3}, ports: [{port: 8333}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: mlflow}
spec:
  replicas: 1
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v3.18.0
        command: ["bash", "-c"]
        args:
        - |
          # The official image has neither a PostgreSQL driver, an S3 client nor the auth extras.
          pip install --quiet --no-cache-dir psycopg2-binary boto3 "mlflow[auth]==3.18.0"
          cat > /tmp/auth.ini <<INI
          [mlflow]
          default_permission = NO_PERMISSIONS
          database_uri = postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow_auth
          admin_username = admin
          admin_password = ${MLFLOW_ADMIN_PASSWORD}
          authorization_function = mlflow.server.auth:authenticate_request_basic_auth
          INI
          export MLFLOW_AUTH_CONFIG_PATH=/tmp/auth.ini
          python - <<PY
          import os, psycopg2
          c = psycopg2.connect(host="postgres", user="mlflow", password=os.environ["POSTGRES_PASSWORD"], dbname="mlflow"); c.autocommit = True
          cur = c.cursor(); cur.execute("select 1 from pg_database where datname='mlflow_auth'")
          cur.fetchone() or cur.execute("create database mlflow_auth")
          PY
          # Default is 4 workers, each ~0.6 GiB resident: OOM-killed at a 2 GiB limit.
          exec mlflow server --host 0.0.0.0 --port 5000 --workers 2 --app-name basic-auth \
            --backend-store-uri "postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow" \
            --artifacts-destination s3://mlflow/artifacts --serve-artifacts \
            --allowed-hosts "mlflow.mlflow.svc.cluster.local:5000,mlflow.mlflow:5000,mlflow.mlflow.svc:5000,mlflow:5000,localhost:*,127.0.0.1:*"
        envFrom: [{secretRef: {name: mlflow-credentials}}]
        env:
        - {name: MLFLOW_S3_ENDPOINT_URL, value: "http://s3:8333"}
        - {name: AWS_DEFAULT_REGION, value: us-east-1}
        ports: [{containerPort: 5000}]
        readinessProbe: {httpGet: {path: /health, port: 5000}, periodSeconds: 5, failureThreshold: 60}
        resources: {requests: {cpu: 200m, memory: 1Gi}, limits: {cpu: "2", memory: 3Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: mlflow}
spec: {selector: {app: mlflow}, ports: [{port: 5000}]}
