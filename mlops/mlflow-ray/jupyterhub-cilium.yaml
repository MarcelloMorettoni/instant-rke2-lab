# The chart's hub NetworkPolicy allows the Kubernetes API by ipBlock. Cilium
# classifies the API server as an entity, which ipBlock rules never match, so
# without this the hub cannot create user pods (spawn times out).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hub-to-kube-apiserver
  namespace: jhub
spec:
  endpointSelector:
    matchLabels: {app: jupyterhub, component: hub}
  egress:
  - toEntities: [kube-apiserver]
---
# The chart's singleuser NetworkPolicy blocks every cluster-internal address, so
# a notebook cannot reach MLflow or the object store that holds its artifacts.
# NetworkPolicies add up: this one opens just those two ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: singleuser-to-mlflow
  namespace: jhub
spec:
  podSelector:
    matchLabels: {app: jupyterhub, component: singleuser-server}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: mlflow}
    ports: [{port: 5000}, {port: 8333}]
---
# Notebooks clone and push the lesson repositories on the lab's git server
# (mlops/gitea). Same reason as above: the chart blocks cluster-internal addresses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: singleuser-to-gitea, namespace: jhub}
spec:
  podSelector: {matchLabels: {app: jupyterhub, component: singleuser-server}}
  policyTypes: [Egress]
  egress:
  - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gitea}}}]
    ports: [{port: 3000, protocol: TCP}]
