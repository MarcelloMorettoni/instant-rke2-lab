# W4 on Kubeflow: the W2 fine-tuned language model behind KServe (serverless mode,
# Knative autoscaling). The stock Hugging Face runtime uses vLLM only on GPU; on
# CPU it falls back to the transformers backend but keeps the OpenAI-style API.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smollm
  annotations:
    sidecar.istio.io/inject: "false"
    autoscaling.knative.dev/metric: concurrency
    autoscaling.knative.dev/target: "1"
spec:
  predictor:
    serviceAccountName: kserve-s3
    minReplicas: 0
    maxReplicas: 3
    model:
      modelFormat: {name: huggingface}
      storageUri: s3://mlpipeline/private/kubeflow-user-example-com/models/w2/w2-lm-finetune
      args: ["--model_name=smollm", "--task=text_generation", "--backend=huggingface"]
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "2", memory: 4Gi}
