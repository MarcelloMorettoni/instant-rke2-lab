# A long-lived "researcher workstation" pod in the profile namespace, used to
# drive the workloads with `kubectl exec`. It talks to Kubeflow the way a
# notebook would: profile ServiceAccount + a projected token for the KFP API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kit
  labels: {app: kit}
spec:
  replicas: 1
  selector: {matchLabels: {app: kit}}
  template:
    metadata:
      labels: {app: kit}
    spec:
      serviceAccountName: default-editor
      containers:
      - name: kit
        image: python:3.11-slim
        command: ["bash", "-c"]
        args:
        - |
          pip install --quiet --no-cache-dir kfp==2.15.0 kfp-kubernetes==2.15.0 model-registry==0.3.4 \
            boto3==1.35.99 pandas==2.2.3 scikit-learn==1.6.1 requests mlflow-skinny==3.18.0 \
          && touch /tmp/ready && sleep infinity
        readinessProbe:
          exec: {command: ["test", "-f", "/tmp/ready"]}
          periodSeconds: 5
        env:
        - {name: PYTHONPATH, value: /testkit}
        - {name: S3_ENDPOINT, value: "http://minio-service.kubeflow.svc.cluster.local:9000"}
        - {name: KF_PIPELINES_SA_TOKEN_PATH, value: /var/run/secrets/kubeflow/pipelines/token}
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: mlpipeline-minio-artifact, key: accesskey}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: mlpipeline-minio-artifact, key: secretkey}}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        volumeMounts:
        - {name: testkit, mountPath: /testkit}
        - {name: workloads, mountPath: /workloads}
        - {name: kfp-token, mountPath: /var/run/secrets/kubeflow/pipelines, readOnly: true}
      volumes:
      - name: testkit
        configMap: {name: testkit}
      - name: workloads
        configMap: {name: workloads}
      - name: kfp-token
        projected:
          sources:
          - serviceAccountToken: {path: token, expirationSeconds: 7200, audience: pipelines.kubeflow.org}
---
# KServe pulls models from the pipeline's object store with this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-s3
secrets:
- name: kserve-s3
