# Probe pods for the isolation checks: an HTTP target and a client per project,
# each in two flavours (inside the Istio mesh, and with the sidecar opted out).
apiVersion: v1
kind: Pod
metadata: {name: web-mesh, labels: {app: web-mesh}}
spec:
  containers:
  - name: web
    image: python:3.11-slim
    command: ["python", "-m", "http.server", "8080"]
    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: web-nomesh
  labels: {app: web-nomesh}
  annotations: {sidecar.istio.io/inject: "false"}
spec:
  containers:
  - name: web
    image: python:3.11-slim
    command: ["python", "-m", "http.server", "8080"]
    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: web-mesh}
spec: {selector: {app: web-mesh}, ports: [{name: http, port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: web-nomesh}
spec: {selector: {app: web-nomesh}, ports: [{name: http, port: 80, targetPort: 8080}]}
