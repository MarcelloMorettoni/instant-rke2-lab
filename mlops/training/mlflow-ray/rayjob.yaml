# Training copy of mlflow-ray/workloads/w2_rayjob.yaml: same job, renamed, with smaller CPU requests
# so it fits next to everything else that now runs on the lab.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: training-finetune
spec:
  entrypoint: python /workloads/w2_ray_train.py
  shutdownAfterJobFinishes: true
  # Training copy: release the cluster 2 minutes after the job ends (the POC kept it 15).
  ttlSecondsAfterFinished: 120
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions: [{key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}]
      containers:
      - name: ray-job-submitter
        image: rayproject/ray:2.60.1-py311-cpu
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
  # No image registry in the lab: dependencies are installed per job on every node.
  runtimeEnvYAML: |
    pip:
      packages: ["torch==2.7.1", "transformers==4.53.2", "mlflow==3.18.0", "boto3==1.35.99"]
      pip_install_options: ["--extra-index-url", "https://download.pytorch.org/whl/cpu"]
    env_vars:
      PYTHONPATH: /testkit
      JOB_NAME: training-finetune
      OMP_NUM_THREADS: "2"
      GIT_PYTHON_REFRESH: quiet
  rayClusterSpec:
    rayVersion: "2.60.1"
    headGroupSpec:
      rayStartParams: {num-cpus: "0"}
      template:
        spec:
          # Keep Ray off the small control-plane node.
          affinity: &workers-only
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions: [{key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}]
          containers:
          - name: ray-head
            image: rayproject/ray:2.60.1-py311-cpu
            resources: {requests: {cpu: 500m, memory: 2Gi}, limits: {cpu: "2", memory: 4Gi}}
            envFrom: [{secretRef: {name: mlflow-client}}, {secretRef: {name: s3-client}}]
            volumeMounts: &mounts
            - {name: testkit, mountPath: /testkit}
            - {name: workloads, mountPath: /workloads}
          volumes: &volumes
          - {name: testkit, configMap: {name: testkit}}
          - {name: workloads, configMap: {name: workloads}}
    workerGroupSpecs:
    - groupName: cpu
      replicas: 2
      minReplicas: 2
      maxReplicas: 2
      rayStartParams: {}
      template:
        spec:
          affinity:
            # Training copy only: with the smaller request a worker would fit on the
            # control-plane VM and run it out of memory. Keep it off.
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions: [{key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}]
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {ray.io/group: cpu}}
          containers:
          - name: ray-worker
            image: rayproject/ray:2.60.1-py311-cpu
            resources: {requests: {cpu: 500m, memory: 3Gi}, limits: {cpu: "3", memory: 5Gi}}
            env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            envFrom: [{secretRef: {name: mlflow-client}}, {secretRef: {name: s3-client}}]
            volumeMounts: *mounts
          volumes: *volumes
