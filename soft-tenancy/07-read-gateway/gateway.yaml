# Step 07a: the read gateway in front of Loki, Mimir, Tempo and Pyroscope,
# built with kgateway (the same Gateway API controller as the ingress, step 12).
#
# All four backends trust whatever X-Scope-OrgID they receive. This gateway
# makes sure the header always comes from the platform, never from the caller:
#
#   Grafana org "Tenant A" --GET /tenant-a/loki/..., X-Api-Key: <Tenant A's key>-->
#       obs-gateway --X-Scope-OrgID: tenant-a|tenant-c--> Loki
#
# This file is the entry point: one Gateway, one listener, and settings shared
# by every route. Who sees what lives in views.yaml: one path prefix per
# Grafana org, opened only by that org's key, with the tenant list fixed by
# the platform. Writes never pass here: Alloy, the OTLP receivers and Tempo
# push straight to the backends (step 08, locked down in step 10).
#
# The Gateway is called obs-gateway and lives in observability, so kgateway
# names its proxy Deployment and Service obs-gateway too, and the proxy pods
# carry the label gateway.networking.k8s.io/gateway-name=obs-gateway (step 10
# uses it).
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: obs-gateway
  namespace: observability
spec:
  kube:
    service:
      type: ClusterIP              # internal only: Grafana is the one client
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: obs-gateway
  namespace: observability
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: obs-gateway
  # One listener for all four backends: the path picks the view and the
  # backend. Only routes from this namespace (the platform's) may attach.
  # Not 8082 or 9091: the proxy uses those itself (readiness, stats).
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes: {namespaces: {from: Same}}
---
# Listener settings:
#   access log  who asked for what (the path starts with the view; the key is
#               never logged), and which tenants the backend was asked for:
#                 tenant=tenant-a|tenant-c "GET /tenant-a/loki/api/v1/labels" 200 675
#               On a 401 nothing was forwarded. Envoy writes the file every
#               few seconds, so lines show up with a delay.
#   paths       normalization and slash merging are on by default; spelled out
#               because the views match on paths (/tenant-a/../tenant-b/...
#               becomes /tenant-b/... before any route is chosen)
#   websocket   Loki's live tail (Grafana Explore → Live)
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: obs-gateway
  namespace: observability
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: obs-gateway
  default:
    httpSettings:
      accessLog:
        - fileSink:
            path: /dev/stdout
            stringFormat: >            # ">" keeps the final newline: one line per request
              tenant=%REQ(X-SCOPE-ORGID)%
              "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%" %RESPONSE_CODE% %BYTES_SENT%
      normalizePath: true
      mergeSlashes: true
      upgradeConfig:
        enabledUpgrades: ["websocket"]
---
# Pushes, deletes and Tempo's overrides API: refused on every view.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: DirectResponse
metadata:
  name: read-only
  namespace: observability
spec:
  status: 403
  body: "read-only gateway\n"
