# Step 07: the read gateway in front of Loki, Mimir, Tempo and Pyroscope.
#
# All four backends trust whatever X-Scope-OrgID they receive. This nginx
# makes the tenant follow from WHO YOU AUTHENTICATED AS, never from what you
# claim:
#
#   Grafana org "Tenant A" --basic auth tenant-a:****--> obs-gateway --X-Scope-OrgID: tenant-a--> backend
#
# One port per backend, read APIs only: pushes, deletes and admin endpoints
# are refused. Writes come from Alloy, the OTLP receivers and Tempo, straight
# to the backends (step 08, locked down in step 10).
# The htpasswd Secret is created by install.sh from generated passwords.
apiVersion: v1
kind: ConfigMap
metadata:
  name: obs-gateway
  namespace: observability
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      # Who asked for what, on which backend. $remote_user is the tenant.
      log_format tenant ':$server_port tenant=$remote_user "$request" $status $body_bytes_sent';
      access_log /dev/stdout tenant;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      # ---- shared by every backend below ---------------------------------
      auth_basic           "observability";
      auth_basic_user_file /etc/nginx/auth/htpasswd;

      # THE line. Replaces any X-Scope-OrgID the client sent.
      proxy_set_header X-Scope-OrgID  $remote_user;
      # Don't forward the tenant's password to the backends.
      proxy_set_header Authorization  "";
      proxy_http_version 1.1;
      proxy_set_header Upgrade        $http_upgrade;
      proxy_set_header Connection     $connection_upgrade;
      proxy_read_timeout 300s;

      upstream loki      { server loki.observability.svc.cluster.local:3100; }
      upstream mimir     { server mimir.observability.svc.cluster.local:8080; }
      upstream tempo     { server tempo.observability.svc.cluster.local:3200; }
      upstream pyroscope { server pyroscope.observability.svc.cluster.local:4040; }

      # ---- :8080 Loki (logs) ---------------------------------------------
      server {
        listen 8080;
        location = /healthz {
          auth_basic off;
          access_log off;
          return 200 "ok\n";
        }
        location = /loki/api/v1/push    { return 403 "read-only gateway\n"; }
        location ^~ /loki/api/v1/delete { return 403 "read-only gateway\n"; }
        location ^~ /loki/api/v1/       { proxy_pass http://loki; }
        location /                      { return 404; }
      }

      # ---- :8081 Mimir (metrics): the Prometheus query API only -----------
      server {
        listen 8081;
        location ^~ /prometheus/api/v1/ { proxy_pass http://mimir; }
        location /                      { return 404; }
      }

      # ---- :8082 Tempo (traces): the query API only ------------------------
      server {
        listen 8082;
        location ^~ /api/overrides { return 403 "read-only gateway\n"; }
        location ^~ /api/          { proxy_pass http://tempo; }
        location /                 { return 404; }
      }

      # ---- :8083 Pyroscope (profiles): the query API only ------------------
      server {
        listen 8083;
        location ^~ /querier.v1.QuerierService/ { proxy_pass http://pyroscope; }
        location /                              { return 404; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-gateway
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obs-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obs-gateway
      annotations:
        # install.sh replaces "0" with a hash of this file, so config edits roll the pod.
        soft-tenancy/config-rev: "0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - {name: loki, containerPort: 8080}
            - {name: mimir, containerPort: 8081}
            - {name: tempo, containerPort: 8082}
            - {name: pyroscope, containerPort: 8083}
          readinessProbe:
            httpGet: {path: /healthz, port: loki}
          livenessProbe:
            httpGet: {path: /healthz, port: loki}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 300m, memory: 96Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: htpasswd
              mountPath: /etc/nginx/auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: obs-gateway
        - name: htpasswd
          secret:
            secretName: obs-gateway-htpasswd
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: obs-gateway
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: obs-gateway
  ports:
    - {name: loki, port: 8080, targetPort: loki}
    - {name: mimir, port: 8081, targetPort: mimir}
    - {name: tempo, port: 8082, targetPort: tempo}
    - {name: pyroscope, port: 8083, targetPort: pyroscope}
