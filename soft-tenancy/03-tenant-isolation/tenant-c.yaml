# Step 03: tenant c's network baseline. Same template as tenant-b.yaml (no
# internet), with one deliberate difference: tenant c also ADMITS tenant a.
#
#   tenant a -> tenant c   allowed: tenant a's egress (tenant-a.yaml) and the
#                          extra ingress rule below
#   tenant c -> tenant a   denied: tenant c's egress is itself only, and the
#                          egressDeny below blocks every other tenant
#   tenant b <-> tenant c  denied both ways
#
# Replies to tenant a's connections still reach tenant a: Cilium tracks
# connections, and policy only decides who may open one.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tenant-c-baseline
spec:
  description: "tenant c: itself, own trace receiver. Accepts tenant a. No internet."
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.namespace.labels.tenant: c

  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.tenant: c
    # Tenant a uses tenant c's services.
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.tenant: a
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alloy

  ingressDeny:
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.cilium.k8s.namespace.labels.tenant
              operator: Exists
            - key: k8s:io.cilium.k8s.namespace.labels.tenant
              operator: NotIn
              values: ["c", "a"]     # a is admitted (above); b and any new tenant are not

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.tenant: c
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.tenant-c.svc.cluster.local"
              - matchPattern: "*.*.tenant-c.svc.cluster.local"
              - matchName: "otlp-tenant-c.observability.svc.cluster.local"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: otlp-receiver
            otlp-tenant: c
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP

  # Tenant a included: c may answer a, never call it.
  egressDeny:
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.cilium.k8s.namespace.labels.tenant
              operator: Exists
            - key: k8s:io.cilium.k8s.namespace.labels.tenant
              operator: NotIn
              values: ["c"]
