# Step 03: tenant a's network baseline.
#
# A CiliumClusterwideNetworkPolicy owned by the platform. Tenants have no
# RBAC on cilium.io, so they can't read, edit or delete it. It selects by
# the namespace `tenant` label, which tenants also can't change (step 01).
#
# Once a pod is selected, everything not listed here is dropped:
#   ingress  <- only tenant a, and the platform's collector (metrics, profiles)
#   egress   -> tenant a, TENANT C's services, the shared CoreDNS (filtered
#               names), its own OTLP trace receiver, example.com:443
# ...and an explicit DENY against every other tenant, in both directions.
# In Cilium, deny beats allow. Whatever allow rule anyone adds later (a
# NetworkPolicy, a sloppy CNP), traffic between tenants stays blocked.
#
# Tenant a may call tenant c; tenant c may NOT call tenant a. It takes both
# sides: this egress rule, and tenant c admitting tenant a (tenant-c.yaml).
# Replies to a's connections flow back regardless: Cilium tracks connections,
# and policy only decides who may open one.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tenant-a-baseline
spec:
  description: "tenant a: itself, tenant c, own trace receiver, example.com. Others: denied."
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.namespace.labels.tenant: a

  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.tenant: a
    # The platform's collector (Alloy) pulls metrics and profiles from pods
    # that opt in. Only platform pods carry these labels in observability.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alloy

  # "Has a tenant label, and it isn't a". Both expressions are needed: NotIn
  # alone would also match kube-system, observability, host, ...
  ingressDeny:
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.cilium.k8s.namespace.labels.tenant
              operator: Exists
            - key: k8s:io.cilium.k8s.namespace.labels.tenant
              operator: NotIn
              values: ["a"]

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.tenant: a

    # Tenant c's services. Tenant c's baseline admits tenant a in return.
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.tenant: c

    # Shared CoreDNS, but every query passes through Cilium's DNS proxy. Names
    # not listed get NXDOMAIN (step 00), so tenant b's services don't exist
    # as far as tenant a can tell. Tenant c's names do: a is allowed to use them.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.tenant-a.svc.cluster.local"     # services
              - matchPattern: "*.*.tenant-a.svc.cluster.local"   # StatefulSet pods
              - matchPattern: "*.tenant-c.svc.cluster.local"     # tenant c's services
              - matchPattern: "*.*.tenant-c.svc.cluster.local"
              - matchName: "otlp-tenant-a.observability.svc.cluster.local"  # own trace receiver
              - matchName: "example.com"                          # internet allowlist

    # Traces: only to tenant a's own OTLP receiver (step 08), which stamps
    # tenant-a on everything it forwards.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: otlp-receiver
            otlp-tenant: a
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP

    # Internet: an explicit FQDN allowlist. It works together with the DNS rule
    # above, because Cilium learns example.com's IPs from the lookups it proxies.
    - toFQDNs:
        - matchName: "example.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

  egressDeny:
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.cilium.k8s.namespace.labels.tenant
              operator: Exists
            - key: k8s:io.cilium.k8s.namespace.labels.tenant
              operator: NotIn
              values: ["a", "c"]     # c is allowed (above); b and any new tenant are not
