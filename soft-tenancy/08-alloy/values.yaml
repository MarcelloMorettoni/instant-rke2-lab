# grafana/alloy — log collector, one pod per node.
#
# Tenants push NOTHING. Alloy reads container log files straight from each
# node's disk and decides the Loki tenant from the namespace name. A tenant
# can't choose, forge or skip its tenant ID, because it never touches this path.
controller:
  type: daemonset
  tolerations:
    - operator: Exists          # every node, control plane included

# The chart's default ClusterRole can read every Secret (and pods/log) in the
# cluster. A log shipper that reads files from disk needs pod metadata, nothing
# more. Least privilege matters here: Alloy runs on every node, next to tenants.
# We switch the chart's RBAC off and declare exactly what Alloy may do below.
rbac:
  create: false

extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: alloy-pod-discovery
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: alloy-pod-discovery
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: alloy-pod-discovery
    subjects:
      - kind: ServiceAccount
        name: alloy
        namespace: observability

alloy:
  mounts:
    varlog: true                # hostPath /var/log (read-only) -> /var/log/pods/*
  configMap:
    create: true
    content: |
      // Pods scheduled on THIS node only: each Alloy reads its own node's files.
      // K8S_NODE_NAME is injected by the chart (downward API, spec.nodeName).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.tenant.receiver]
      }

      loki.process "tenant" {
        stage.cri {}

        // THE tenancy decision. Namespace names are platform-controlled, and
        // step 01's admission policy ties tenant-X / tenant-X-* to tenant X,
        // so nobody inside a tenant can change this mapping.
        stage.match {
          selector = "{namespace=~\"tenant-a(-.+)?\"}"
          stage.tenant {
            value = "tenant-a"
          }
        }
        stage.match {
          selector = "{namespace=~\"tenant-b(-.+)?\"}"
          stage.tenant {
            value = "tenant-b"
          }
        }

        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          // Straight to Loki's push endpoint, not through the read gateway.
          // Step 10 makes Alloy the only thing allowed to reach it.
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"

          // Anything no match block claimed lands in "platform", never in a tenant.
          tenant_id = "platform"
        }
      }
