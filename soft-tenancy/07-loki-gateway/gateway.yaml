# Step 07: the Loki read gateway.
#
# Loki trusts whatever X-Scope-OrgID it receives. This nginx makes the tenant
# follow from WHO YOU AUTHENTICATED AS, never from what you claim:
#
#   Grafana org "Tenant A" --basic auth tenant-a:****--> gateway --X-Scope-OrgID: tenant-a--> Loki
#
# Any X-Scope-OrgID the client sends is overwritten. It's read-only: push and
# delete are refused (Alloy pushes to Loki directly, see step 08).
# The htpasswd Secret is created by install.sh from generated passwords.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-gateway
  namespace: observability
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      # Who asked for what. $remote_user is the authenticated tenant.
      log_format tenant '$remote_addr tenant=$remote_user "$request" $status $body_bytes_sent';
      access_log /dev/stdout tenant;

      # Live tail in Grafana is a websocket.
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      upstream loki {
        server loki.observability.svc.cluster.local:3100;
      }

      server {
        listen 8080;

        location = /healthz {
          auth_basic off;
          access_log off;
          return 200 "ok\n";
        }

        auth_basic           "loki";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        # THE line. Replaces any X-Scope-OrgID the client sent.
        proxy_set_header X-Scope-OrgID  $remote_user;
        # Don't forward the tenant's password to Loki.
        proxy_set_header Authorization  "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade        $http_upgrade;
        proxy_set_header Connection     $connection_upgrade;
        proxy_read_timeout 300s;

        # Read path only.
        location = /loki/api/v1/push    { return 403 "read-only gateway\n"; }
        location ^~ /loki/api/v1/delete { return 403 "read-only gateway\n"; }
        location ^~ /loki/api/v1/       { proxy_pass http://loki; }
        location /                      { return 404; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-gateway
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-gateway
      annotations:
        # install.sh replaces "0" with a hash of this file, so config edits roll the pod.
        soft-tenancy/config-rev: "0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: htpasswd
              mountPath: /etc/nginx/auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: loki-gateway
        - name: htpasswd
          secret:
            secretName: loki-gateway-htpasswd
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki-gateway
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: loki-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
