# Mimir: metrics, monolithic (-target=all), multi-tenant, filesystem storage.
#
# Mimir's only Helm chart deploys the full microservices setup with object
# storage. For a lab, a single binary is enough, and it keeps the tenancy
# model easy to see: multitenancy_enabled makes every push and query name its
# tenant in X-Scope-OrgID. As with Loki, Mimir trusts that header, so Alloy
# and Tempo set it on the write path and the read gateway on the read path.
# In production, use mimir-distributed with object storage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir
  namespace: observability
data:
  mimir.yaml: |
    multitenancy_enabled: true
    # Queries may name several tenants ("tenant-a|tenant-c"); the results get a
    # __tenant_id__ label. As with Loki, only the read gateway sets that header.
    tenant_federation:
      enabled: true
    usage_stats:
      enabled: false
    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: warn
    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data/common
    blocks_storage:
      storage_prefix: blocks
      filesystem:
        dir: /data/blocks
      bucket_store:
        sync_dir: /data/tsdb-sync
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: memberlist
    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
        replication_factor: 1
    store_gateway:
      sharding_ring:
        replication_factor: 1
    ruler_storage:
      storage_prefix: rules
    alertmanager_storage:
      storage_prefix: alertmanager
    limits:
      # Defaults for every tenant. Per-tenant values go in runtime overrides.
      max_global_series_per_user: 150000
      ingestion_rate: 20000
      compactor_blocks_retention_period: 72h
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: observability
spec:
  serviceName: mimir
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mimir
          image: docker.io/grafana/mimir:3.2.1
          args: ["-config.file=/etc/mimir/mimir.yaml", "-target=all"]
          # Mimir writes several files relative to its working directory
          # (activity log, ruler and alertmanager scratch dirs). Run it from
          # the data volume so the root filesystem can stay read-only.
          workingDir: /data
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mimir
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9095
      targetPort: grpc
