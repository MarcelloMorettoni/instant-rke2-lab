# grafana-community/grafana — one Grafana, one org per tenant.
#
# Orgs, users and data sources are NOT created here. setup-orgs.sh does that
# through the API, because Grafana can't provision orgs or users from files.
# This file only hardens the instance itself.
persistence:
  enabled: true
  size: 1Gi

# Grafana never needs to talk to the Kubernetes API (no sidecars here).
automountServiceAccountToken: false
rbac:
  create: false

testFramework:
  enabled: false

grafana.ini:
  users:
    allow_sign_up: false
    # Tenants must not be able to create orgs of their own.
    allow_org_create: false
    # New users land in Main Org (id 1). We keep Main Org EMPTY (no data
    # sources) so that landing there shows nothing. setup-orgs.sh also removes
    # tenant users from it.
    auto_assign_org: true
    auto_assign_org_id: 1
    auto_assign_org_role: Viewer
  auth.anonymous:
    enabled: false
  security:
    disable_gravatar: true
    cookie_samesite: strict
  # No phone-home. The network policy in step 10 blocks internet egress anyway.
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
    feedback_links_enabled: false
  news:
    news_feed_enabled: false
