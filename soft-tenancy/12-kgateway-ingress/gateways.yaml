      name: tenant-b
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      hostname: "*.tenant-b.lab"
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              tenant: b
---
