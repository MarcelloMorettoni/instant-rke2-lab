# Step 12d: Grafana behind the platform gateway (platform-owned route).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: platform
      namespace: kgateway-system
  hostnames:
    - grafana.platform.lab
  rules:
    - backendRefs:
        - name: grafana
          port: 80
