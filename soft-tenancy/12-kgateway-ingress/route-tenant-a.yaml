# Step 12e: tenant a publishes its app. Applied BY alice:
#   kubectl --as alice apply -f 12-kgateway-ingress/route-tenant-a.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: tenant-a
spec:
  parentRefs:
    - name: tenant-a
      namespace: kgateway-system
  hostnames:
    - web.tenant-a.lab
  rules:
    - backendRefs:
        - name: web
          port: 80
