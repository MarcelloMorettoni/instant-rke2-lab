# Step 10: lock down the observability namespace.
#
#   write:  Alloy ──POST push only (L7)──► Loki, Mimir, Pyroscope
#           tenant pods ──► their OWN otlp-tenant-X ──► Tempo ──► Mimir (service graphs)
#           (X = a, b, c: tenant a may use tenant c's services, not its receiver)
#   read:   Grafana ──► obs-gateway (kgateway) ──► Loki, Mimir, Tempo, Pyroscope
#
# Nothing else may reach the backends, the gateway or Grafana, and none of
# them may reach the internet. Pod labels are safe to use HERE: only the
# platform can create pods in this namespace (tenants have no RBAC in it).
# kgateway labels the read gateway's proxy pods
# gateway.networking.k8s.io/gateway-name=obs-gateway.
# Rules that name tenant namespaces are cluster-wide policies, so no selector
# gets silently scoped to "observability".
#
# Admin access still works: kubectl port-forward enters the pod's network
# namespace directly and never crosses Cilium's policy hooks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: observability
spec:
  description: "Every pod: default deny both ways, DNS allowed."
  endpointSelector: {}
  ingress:
    - {}            # empty rule = default deny, allows nothing
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# ---------------------------------------------------------------- backends
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki
  namespace: observability
spec:
  description: "Loki: pushes only from Alloy, queries only from the gateway."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: single-binary
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
          # L7: even Alloy can only PUSH. A compromised collector can't read
          # anyone's logs (Envoy answers anything else with 403).
          rules:
            http:
              - method: POST
                path: /loki/api/v1/push
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: obs-gateway
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:              # Loki talking to itself (ring, compactor)
        - matchLabels:
            app.kubernetes.io/name: loki
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mimir
  namespace: observability
spec:
  description: "Mimir: pushes only from Alloy and Tempo, queries only from the gateway."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mimir
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: /api/v1/push
    # Tempo's metrics generator writes service-graph metrics, per tenant.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tempo
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: /api/v1/push
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: obs-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mimir
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mimir
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tempo
  namespace: observability
spec:
  description: "Tempo: spans only from the tenant OTLP receivers, queries only from the gateway."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: otlp-receiver
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: obs-gateway
      toPorts:
        - ports:
            - port: "3200"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tempo
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tempo
    - toEndpoints:                # metrics generator -> Mimir
        - matchLabels:
            app.kubernetes.io/name: mimir
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pyroscope
  namespace: observability
spec:
  description: "Pyroscope: pushes only from Alloy, queries only from the gateway."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "4040"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: /push.v1.PusherService/Push
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: obs-gateway
      toPorts:
        - ports:
            - port: "4040"
              protocol: TCP
    - fromEndpoints:              # metastore (raft), ring, query backend
        - matchLabels:
            app.kubernetes.io/name: pyroscope
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: pyroscope
    - toEntities:                 # the metastore finds its peers via the API
        - kube-apiserver
---
# ---------------------------------------------------------------- read path
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: obs-gateway
  namespace: observability
spec:
  description: "Read gateway: called only by Grafana; calls only the backends' query ports."
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: obs-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}     # the one listener; the path picks the view
  egress:
    - toEndpoints:
        - matchLabels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: single-binary}
      toPorts: [{ports: [{port: "3100", protocol: TCP}]}]
    - toEndpoints:
        - matchLabels: {app.kubernetes.io/name: mimir}
      toPorts: [{ports: [{port: "8080", protocol: TCP}]}]
    - toEndpoints:
        - matchLabels: {app.kubernetes.io/name: tempo}
      toPorts: [{ports: [{port: "3200", protocol: TCP}]}]
    - toEndpoints:
        - matchLabels: {app.kubernetes.io/name: pyroscope}
      toPorts: [{ports: [{port: "4040", protocol: TCP}]}]
    # Its configuration (xDS) comes from the kgateway controller.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kgateway-system
            kgateway: kgateway
      toPorts: [{ports: [{port: "9977", protocol: TCP}]}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: observability
spec:
  description: "Grafana: may only call the gateway (not the backends, not the internet)."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  # No ingress rule here: until step 12, users reach Grafana with port-forward.
  # Step 12 adds "grafana-from-gateway", which allows only the platform's
  # kgateway proxy in.
  egress:
    # Not the backends directly. If an admin created a data source pointing at
    # mimir:8080 with a spoofed header, the packets would be dropped.
    - toEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: obs-gateway
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
---
# ---------------------------------------------------------------- write path
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: alloy-collector
spec:
  description: "Alloy: Kubernetes API, opted-in pods, pushes to the backends. Nothing else."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: observability
      app.kubernetes.io/name: alloy
  egress:
    - toEntities:
        - kube-apiserver
    # Pull metrics and profiles from pods anywhere; each tenant's baseline
    # admits Alloy (step 03). The pushes to Loki, Mimir and Pyroscope are in
    # here too; the push-only L7 rules sit on the backends' ingress side.
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: otlp-tenant-a
spec:
  description: "tenant a's trace receiver: accepts only tenant a, forwards only to Tempo."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: observability
      app.kubernetes.io/name: otlp-receiver
      otlp-tenant: a
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.tenant: a
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: tempo
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: otlp-tenant-b
spec:
  description: "tenant b's trace receiver: accepts only tenant b, forwards only to Tempo."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: observability
      app.kubernetes.io/name: otlp-receiver
      otlp-tenant: b
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.tenant: b
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: tempo
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: otlp-tenant-c
spec:
  description: "tenant c's trace receiver: accepts only tenant c, forwards only to Tempo."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: observability
      app.kubernetes.io/name: otlp-receiver
      otlp-tenant: c
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.tenant: c
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: tempo
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
