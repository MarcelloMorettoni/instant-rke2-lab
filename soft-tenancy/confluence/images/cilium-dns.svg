<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t">
<title id="t">DNS filtering</title>
<defs><marker id="ah16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="ah64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="479" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32" y="44" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">DNS filtering</text>
<text x="32" y="68" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748B">Every tenant DNS query passes through Cilium&#x27;s DNS proxy before it reaches CoreDNS</text>
<rect x="32" y="96" width="150" height="304" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="48" y="124" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="start">tenant-a pod</text>
<text x="48" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">asks for:</text>
<rect x="412" y="96" width="176" height="304" rx="10" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
<text x="428" y="124" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#155E75" text-anchor="start">Cilium DNS proxy</text>
<text x="428" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">on the node</text>
<text x="428" y="352" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">allowed for tenant-a:</text>
<text x="428" y="370" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#155E75" text-anchor="start">*.tenant-a.svc...</text>
<text x="428" y="387" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#155E75" text-anchor="start">example.com</text>
<rect x="758" y="96" width="170" height="304" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="774" y="124" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start">CoreDNS</text>
<text x="774" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">shared</text>
<path d="M182,196 L408,196" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah64748B)"/>
<text x="295" y="187" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">web.tenant-a.svc.cluster.local</text>
<text x="295" y="214" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">answer: 10.43.12.7</text>
<path d="M588,196 L754,196" fill="none" stroke="#16A34A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah16A34A)"/>
<text x="671" y="187" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#166534" text-anchor="middle">forwarded</text>
<path d="M182,266 L408,266" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah64748B)"/>
<text x="295" y="257" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">example.com</text>
<text x="295" y="284" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">answer: its IP (egress opens)</text>
<path d="M588,266 L754,266" fill="none" stroke="#16A34A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah16A34A)"/>
<text x="671" y="257" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#166534" text-anchor="middle">forwarded</text>
<path d="M182,336 L408,336" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah64748B)"/>
<text x="295" y="327" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">web.tenant-b.svc.cluster.local</text>
<text x="295" y="354" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">answer: NXDOMAIN</text>
<g transform="translate(616,336) scale(0.9090909090909091)"><circle r="11" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="634" y="340" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#991B1B" text-anchor="start">never forwarded</text>
<text x="32" y="438" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Blocked names get NXDOMAIN (&quot;does not exist&quot;), not REFUSED. With REFUSED, Linux resolvers stop</text>
<text x="32" y="456" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">walking their search list, and even allowlisted names like example.com stop resolving.</text>
</svg>
