<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="t">
<title id="t">Inside Tempo: one tenant per X-Scope-OrgID</title>
<defs><marker id="ah059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah4338CA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338CA"/></marker><marker id="ah475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ahDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="499" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32" y="44" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">Inside Tempo: one tenant per X-Scope-OrgID</text>
<text x="32" y="68" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748B">The header picks the tenant, and the read gateway is what sets it</text>
<rect x="32" y="124" width="200" height="44" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="48" y="151" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#1E40AF" text-anchor="start">X-Scope-OrgID: tenant-a</text>
<path d="M232,146 L296,146" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah2563EB)"/>
<rect x="32" y="188" width="200" height="44" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="48" y="215" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="start">X-Scope-OrgID: tenant-c</text>
<path d="M232,210 L296,210" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah059669)"/>
<rect x="32" y="252" width="200" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="48" y="279" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start">X-Scope-OrgID: platform</text>
<path d="M232,274 L296,274" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah475569)"/>
<rect x="32" y="316" width="200" height="44" rx="8" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="48" y="336" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#3730A3" text-anchor="start">X-Scope-OrgID:</text>
<text x="48" y="352" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#3730A3" text-anchor="start">tenant-a|tenant-c</text>
<path d="M232,338 L296,338" fill="none" stroke="#4338CA" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah4338CA)"/>
<rect x="32" y="380" width="200" height="44" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
<text x="48" y="407" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#991B1B" text-anchor="start">no header</text>
<path d="M232,402 L296,402" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahDC2626)"/>
<rect x="300" y="110" width="220" height="330" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="318" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A8A" text-anchor="start">Tempo</text>
<text x="318" y="162" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#1E3A8A" text-anchor="start">multitenancyEnabled: true</text>
<text x="318" y="196" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">reads the header on</text>
<text x="318" y="213" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">every push and query,</text>
<text x="318" y="230" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">and scopes the request</text>
<text x="318" y="247" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">to those tenants</text>
<g transform="translate(330,338) scale(0.8181818181818182)"><circle r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/><path d="M-5,0.5 L-1.5,4 L5,-3.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="346" y="328" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#166534" text-anchor="start">both spaces,</text>
<text x="346" y="342" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#166534" text-anchor="start">in one answer</text>
<g transform="translate(330,402) scale(0.8181818181818182)"><circle r="11" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="346" y="407" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B" text-anchor="start">401: no org id</text>
<text x="318" y="268" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="start">It never checks who</text>
<text x="318" y="283" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="start">sent the header: that is</text>
<text x="318" y="298" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="start">the gateway&#x27;s job.</text>
<text x="620" y="104" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">STORAGE</text>
