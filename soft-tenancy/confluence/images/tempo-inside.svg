<path d="M520,274 L556,274" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah475569)"/>
<path d="M520,338 L540,338 L540,190 L556,190" fill="none" stroke="#4338CA" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah4338CA)"/>
<text x="560" y="392" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">tenant-b is in here too, with its own</text>
<text x="560" y="408" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">space: no view asks for it and tenant-a</text>
<text x="560" y="424" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">at the same time.</text>
<text x="560" y="452" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">Per-tenant limits keep one noisy tenant from starving the others.</text>
