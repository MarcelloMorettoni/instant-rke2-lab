<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t">
<title id="t">Why the gateway exists</title>
<defs><marker id="ah16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="ah4338CA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338CA"/></marker><marker id="ahDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="469" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32" y="44" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">Why the gateway exists</text>
<text x="32" y="68" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748B">None of the backends checks the X-Scope-OrgID header it receives</text>
<rect x="24" y="88" width="444" height="360" rx="14" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
<text x="44" y="116" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#991B1B" text-anchor="start">Without a gateway</text>
<rect x="144" y="146" width="204" height="56" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="246.0" y="178.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle">any pod that reaches a backend</text>
<path d="M246,202 L246,296" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahDC2626)"/>
<text x="258" y="240" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#991B1B" text-anchor="start">X-Scope-OrgID: tenant-b</text>
<text x="258" y="258" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">just a claim</text>
<rect x="144" y="300" width="204" height="56" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
<text x="246.0" y="323.55" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Loki · Mimir</text>
<text x="246.0" y="345.45" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="middle">Tempo · Pyroscope</text>
<path d="M144,328 L104,328 L104,174 L140,174" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahDC2626)"/>
<text x="36" y="244" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B" text-anchor="start">tenant-b&#x27;s</text>
<text x="36" y="260" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B" text-anchor="start">data</text>
<g transform="translate(56,406) scale(1.0)"><circle r="11" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="76" y="403" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#991B1B" text-anchor="start">Anyone who can reach a backend can read,</text>
<text x="76" y="421" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#991B1B" text-anchor="start">or forge, any tenant&#x27;s telemetry.</text>
<rect x="492" y="88" width="444" height="360" rx="14" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
<text x="512" y="116" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534" text-anchor="start">With the gateway</text>
<rect x="612" y="136" width="204" height="50" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
<text x="714.0" y="165.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9A3412" text-anchor="middle">Grafana, org Tenant A</text>
<path d="M714,186 L714,230" fill="none" stroke="#4338CA" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah4338CA)"/>
<text x="726" y="202" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">GET /tenant-a/loki/...</text>
<text x="726" y="218" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">X-Api-Key: Tenant A&#x27;s key</text>
<rect x="612" y="234" width="204" height="56" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="714.0" y="250.55" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3730A3" text-anchor="middle">obs-gateway (kgateway)</text>
<text x="714.0" y="270.45" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">the path is the view;</text>
<text x="714.0" y="286.45" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">only its key opens it</text>
<path d="M714,290 L714,330" fill="none" stroke="#16A34A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah16A34A)"/>
<text x="726" y="313" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#166534" text-anchor="start">X-Scope-OrgID:</text>
<text x="726" y="327" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#166534" text-anchor="start">tenant-a|tenant-c</text>
<rect x="612" y="334" width="204" height="50" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
<text x="714.0" y="363.55" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">any backend</text>
<path d="M612,359 L578,359 L578,161 L608,161" fill="none" stroke="#16A34A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah16A34A)"/>
<text x="504" y="244" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#166534" text-anchor="start">tenant a&#x27;s and</text>
<text x="504" y="260" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#166534" text-anchor="start">tenant c&#x27;s data</text>
<g transform="translate(524,418) scale(1.0)"><circle r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/><path d="M-5,0.5 L-1.5,4 L5,-3.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="544" y="423" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#166534" text-anchor="start">The tenants come from the view and its key, never from the header.</text>
</svg>
