<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="t">
<title id="t">Traces: one receiver per tenant</title>
<defs><marker id="ah16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="ah4338CA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338CA"/></marker><marker id="ahDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="449" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32" y="44" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">Traces: one receiver per tenant</text>
<text x="32" y="68" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748B">The only signal apps push. The receiver, not the app, decides the tenant.</text>
<rect x="32" y="110" width="200" height="110" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="48" y="136" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1E40AF" text-anchor="start">namespace tenant-a</text>
<text x="48" y="160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">frontend, backend</text>
<text x="48" y="182" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">OTLP gRPC :4317</text>
<rect x="32" y="270" width="200" height="110" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="48" y="296" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5B21B6" text-anchor="start">namespace tenant-b</text>
<text x="48" y="320" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">frontend, backend</text>
<text x="48" y="342" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">OTLP gRPC :4317</text>
<rect x="380" y="120" width="200" height="90" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="396" y="146" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13.5" font-weight="700" fill="#3730A3" text-anchor="start">otlp-tenant-a</text>
<text x="396" y="168" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" fill="#1E40AF" text-anchor="start">TENANT=tenant-a</text>
<text x="396" y="190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">sets X-Scope-OrgID itself</text>
