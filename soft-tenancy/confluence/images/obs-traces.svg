<text x="396" y="306" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13.5" font-weight="700" fill="#3730A3" text-anchor="start">otlp-tenant-b</text>
<text x="396" y="328" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" fill="#5B21B6" text-anchor="start">TENANT=tenant-b</text>
<text x="396" y="350" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">sets X-Scope-OrgID itself</text>
<path d="M232,165 L376,165" fill="none" stroke="#16A34A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah16A34A)"/>
