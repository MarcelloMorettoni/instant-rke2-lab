<text x="32" y="440" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">An app that sets X-Scope-OrgID itself changes nothing: the receiver never forwards it, and a tenant</text>
<text x="32" y="458" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">can only reach its own receiver (step 03 egress, step 10 ingress). When tenant a calls tenant c, each</text>
<text x="32" y="476" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">half of that trace lands in its own tenant: tenant a&#x27;s Grafana org reads both and sees it whole.</text>
