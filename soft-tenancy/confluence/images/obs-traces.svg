<path d="M232,325 L376,325" fill="none" stroke="#16A34A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah16A34A)"/>
<g transform="translate(304,325) scale(0.8181818181818182)"><circle r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/><path d="M-5,0.5 L-1.5,4 L5,-3.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M232,300 L376,190" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahDC2626)"/>
<g transform="translate(304,245) scale(0.9090909090909091)"><circle r="11" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="320" y="262" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#991B1B" text-anchor="start">Cilium drops it</text>
<rect x="680" y="110" width="248" height="270" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="698" y="138" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="start">Tempo</text>
<text x="698" y="158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">multitenancy enabled</text>
<rect x="698" y="180" width="210" height="54" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="714" y="213" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13.5" font-weight="700" fill="#1E40AF" text-anchor="start">tenant-a</text>
<rect x="698" y="250" width="210" height="54" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="714" y="283" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13.5" font-weight="700" fill="#5B21B6" text-anchor="start">tenant-b</text>
<text x="698" y="346" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">metrics generator → Mimir,</text>
<text x="698" y="361" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">same tenant (service map)</text>
<path d="M580,165 L620,165 L620,207 L694,207" fill="none" stroke="#4338CA" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah4338CA)"/>
<path d="M580,325 L620,325 L620,277 L694,277" fill="none" stroke="#4338CA" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah4338CA)"/>
<text x="32" y="414" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">An app that sets X-Scope-OrgID itself changes nothing: the receiver never forwards it.</text>
<text x="32" y="432" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">And a tenant can only reach its own receiver (step 03 egress, step 10 ingress).</text>
</svg>
