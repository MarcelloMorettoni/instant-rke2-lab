<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t">
<title id="t">How Cilium decides who may talk</title>
<defs><marker id="ah16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="ah64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="ahDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="429" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32" y="44" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">How Cilium decides who may talk</text>
<text x="32" y="68" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748B">Identity comes from labels the tenant cannot change</text>
<rect x="32" y="96" width="200" height="150" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<circle cx="58" cy="124" r="12" fill="#2563EB"/>
<text x="58" y="129" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="78" y="129" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="start">A pod starts</text>
<text x="48" y="158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">in namespace tenant-a</text>
<text x="48" y="184" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">namespace label (platform):</text>
<text x="48" y="202" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="700" fill="#1E40AF" text-anchor="start">tenant=a</text>
<text x="48" y="228" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">pod labels (tenant): app=web</text>
<rect x="270" y="96" width="200" height="150" rx="10" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
<circle cx="296" cy="124" r="12" fill="#0E7490"/>
<text x="296" y="129" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="316" y="129" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#155E75" text-anchor="start">Cilium assigns</text>
<text x="286" y="166" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#155E75" text-anchor="start">identity 48213</text>
<text x="286" y="194" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">built from those labels,</text>
<text x="286" y="211" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">shared by every pod</text>
<text x="286" y="228" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">with the same labels</text>
<rect x="508" y="96" width="210" height="150" rx="10" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
<circle cx="534" cy="124" r="12" fill="#0E7490"/>
<text x="534" y="129" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="554" y="129" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#155E75" text-anchor="start">Every packet</text>
<text x="524" y="158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">eBPF on the node checks:</text>
<text x="524" y="184" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">source identity</text>
<text x="524" y="204" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">destination identity</text>
<text x="524" y="224" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">port and protocol</text>
<path d="M232,171 L266,171" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah64748B)"/>
<path d="M470,171 L504,171" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah64748B)"/>
<path d="M718,171 L736,171 L736,130 L752,130" fill="none" stroke="#16A34A" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah16A34A)"/>
<path d="M718,171 L736,171 L736,212 L752,212" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahDC2626)"/>
<rect x="756" y="96" width="172" height="68" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
<g transform="translate(782,130) scale(1.0)"><circle r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/><path d="M-5,0.5 L-1.5,4 L5,-3.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="802" y="126" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534" text-anchor="start">Allowed</text>
<text x="802" y="146" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">same tenant</text>
<rect x="756" y="178" width="172" height="68" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
<g transform="translate(782,212) scale(1.0)"><circle r="11" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="802" y="208" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991B1B" text-anchor="start">Dropped</text>
<text x="802" y="228" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">other tenant</text>
<rect x="32" y="280" width="436" height="122" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
<g transform="translate(58,310) scale(1.0)"><circle r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/><path d="M-5,0.5 L-1.5,4 L5,-3.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="78" y="315" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534" text-anchor="start">Trusted</text>
<text x="56" y="346" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Namespace names and namespace labels.</text>
<text x="56" y="365" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Namespaces are cluster-scoped: tenants cannot</text>
<text x="56" y="384" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">create, rename or relabel them.</text>
<rect x="492" y="280" width="436" height="122" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
<g transform="translate(518,310) scale(1.0)"><circle r="11" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="538" y="315" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400E" text-anchor="start">Never trusted</text>
<text x="516" y="346" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Pod labels, service accounts, HTTP headers:</text>
<text x="516" y="365" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">anything inside the tenant&#x27;s own namespace.</text>
<text x="516" y="384" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Tenants set those freely.</text>
</svg>
