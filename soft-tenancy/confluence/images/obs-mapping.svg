<path d="M202,294 L296,294" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah94A3B8)"/>
<rect x="32" y="319" width="170" height="32" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="48" y="340" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start">observability</text>
<path d="M202,335 L296,335" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah94A3B8)"/>
<rect x="32" y="360" width="170" height="32" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="48" y="381" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start">tenant-ab</text>
<path d="M202,376 L296,376" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah94A3B8)"/>
<rect x="300" y="114" width="330" height="276" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.5"/>
<text x="318" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#115E59" text-anchor="start">one tenant_pipeline per tenant</text>
<rect x="314" y="158" width="302" height="28" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="326" y="177" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#1E40AF" text-anchor="start">tenant_a  keep tenant-a(-.+)?</text>
<rect x="314" y="194" width="302" height="28" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="326" y="213" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#5B21B6" text-anchor="start">tenant_b  keep tenant-b(-.+)?</text>
<rect x="314" y="230" width="302" height="28" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="326" y="249" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#065F46" text-anchor="start">tenant_c  keep tenant-c(-.+)?</text>
<rect x="314" y="266" width="302" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="326" y="285" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#334155" text-anchor="start">platform  everything else</text>
<text x="318" y="330" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Patterns are anchored, so tenant-ab is</text>
<text x="318" y="347" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">not tenant-a. It lands in platform, safely.</text>
<text x="318" y="372" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Tenants only opt pods in (annotations);</text>
<text x="318" y="389" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">they never pick the tenant.</text>
<rect x="720" y="120" width="208" height="56" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="740" y="154" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="start">tenant-a</text>
