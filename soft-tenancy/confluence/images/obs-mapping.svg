<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t">
<title id="t">Logs, metrics, profiles: which tenant?</title>
<defs><marker id="ah2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ah475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="ah94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="429" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32" y="44" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">Logs, metrics, profiles: which tenant?</text>
<text x="32" y="68" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748B">Alloy pulls them and decides from the namespace name. Anything unmatched goes to platform.</text>
<text x="32" y="102" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">NAMESPACE</text>
<text x="300" y="102" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">ALLOY PIPELINE</text>
<text x="720" y="102" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">TENANT (all three backends)</text>
<rect x="32" y="114" width="170" height="36" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="48" y="137" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#1E40AF" text-anchor="start">tenant-a</text>
<path d="M202,132 L296,132" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah94A3B8)"/>
<rect x="32" y="162" width="170" height="36" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="48" y="185" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#1E40AF" text-anchor="start">tenant-a-dev</text>
<path d="M202,180 L296,180" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah94A3B8)"/>
<rect x="32" y="210" width="170" height="36" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="48" y="233" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#5B21B6" text-anchor="start">tenant-b</text>
<path d="M202,228 L296,228" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah94A3B8)"/>
<rect x="32" y="258" width="170" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="48" y="281" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start">kube-system</text>
<path d="M202,276 L296,276" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah94A3B8)"/>
<rect x="32" y="306" width="170" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="48" y="329" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start">observability</text>
<path d="M202,324 L296,324" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah94A3B8)"/>
<rect x="32" y="354" width="170" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="48" y="377" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start">tenant-ab</text>
<path d="M202,372 L296,372" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah94A3B8)"/>
<rect x="300" y="114" width="330" height="276" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.5"/>
<text x="318" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#115E59" text-anchor="start">one tenant_pipeline per tenant</text>
<rect x="314" y="158" width="302" height="28" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="326" y="177" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#1E40AF" text-anchor="start">tenant_a  keep tenant-a(-.+)?</text>
<rect x="314" y="198" width="302" height="28" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="326" y="217" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#5B21B6" text-anchor="start">tenant_b  keep tenant-b(-.+)?</text>
<rect x="314" y="238" width="302" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="326" y="257" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#334155" text-anchor="start">platform  everything else</text>
<text x="318" y="318" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Patterns are anchored, so tenant-ab is</text>
<text x="318" y="335" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">not tenant-a. It lands in platform, safely.</text>
<text x="318" y="364" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Tenants only opt pods in (annotations);</text>
<text x="318" y="381" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">they never pick the tenant.</text>
<rect x="720" y="144" width="208" height="56" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="740" y="178" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="start">tenant-a</text>
<path d="M616,172 L716,172" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah2563EB)"/>
<rect x="720" y="228" width="208" height="56" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="740" y="262" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="start">tenant-b</text>
<path d="M616,212 L680,212 L680,256 L716,256" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah7C3AED)"/>
<rect x="720" y="312" width="208" height="56" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="740" y="346" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#334155" text-anchor="start">platform</text>
<path d="M616,252 L650,252 L650,340 L716,340" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah475569)"/>
</svg>
