<text x="740" y="222" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="start">tenant-b</text>
<path d="M616,204 L680,204 L680,216 L716,216" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah7C3AED)"/>
