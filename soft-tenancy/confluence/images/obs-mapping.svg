<text x="740" y="290" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#065F46" text-anchor="start">tenant-c</text>
<path d="M616,240 L668,240 L668,284 L716,284" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah059669)"/>
