<text x="372" y="153" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#155E75" text-anchor="middle">Cilium on every node (eBPF)  ·  one platform-owned policy per tenant</text>
