<text x="32" y="530" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Every tenant gets the same template: itself, the platform&#x27;s collector, its own DNS names.</text>
<text x="32" y="547" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">What differs is what the platform adds, per direction: tenant a -&gt; tenant c, and nothing else.</text>
