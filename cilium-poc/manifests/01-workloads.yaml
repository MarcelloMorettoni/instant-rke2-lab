# Step 01: one workload per namespace, and nothing else.
#
#   app   nginx answering "hello from tenant-cilium-x", behind Service `app`
#         (port 80). The image ships curl, so the same pods are also the
#         test clients.
#
# Under default deny these pods start, but nobody can talk to them and they
# can talk to nobody, not even DNS. If the cluster also polices traffic from
# the node itself (Cilium's allow-localhost=policy), they don't even turn
# Ready: the kubelet's readiness probe is blocked too. Step 02 allows both.
#
# Two replicas each: a pod calling its own Service can land on itself, and
# that never leaves the pod, so no policy would ever see it. With two pods,
# "same namespace works" is tested for real.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-content
  namespace: tenant-cilium-a
data:
  index.html: "hello from tenant-cilium-a\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: tenant-cilium-a
spec:
  replicas: 2
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: app-content
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: tenant-cilium-a
spec:
  selector: {app: app}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-content
  namespace: tenant-cilium-b
data:
