# Step 01: one workload per namespace.
#
#   app   nginx answering "hello from team-x", behind Service `app` (port 80).
#         The image ships curl, so the same pods are also the test clients.
#
# Two replicas each: a pod calling its own Service can land on itself, and
# that never leaves the pod, so no policy would ever see it. With two pods,
# "same namespace still works" is tested for real.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-content
  namespace: team-a
data:
  index.html: "hello from team-a\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: team-a
spec:
  replicas: 2
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: app-content
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: team-a
spec:
  selector: {app: app}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
