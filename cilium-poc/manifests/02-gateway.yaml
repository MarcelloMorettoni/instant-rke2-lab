# Step 02: kgateway is the front door. One Gateway, one HTTPRoute per team.
#
#   team-a.poc.lab  ->  Service app in team-a
#   team-b.poc.lab  ->  Service app in team-b
#
# The Gateway lives in kgateway-system, where only the platform can create
# pods. That matters in step 03: kgateway labels its proxy pods
# gateway.networking.k8s.io/gateway-name=<Gateway>, and the policies trust
# that label only because nobody else can put a pod in this namespace.
#
# The proxy Service is ClusterIP on purpose, so nothing new is exposed on a
# secured cluster. Reach it with kubectl port-forward (see README). For a real
# entry point, change the type to LoadBalancer or NodePort.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: cilium-poc
  namespace: kgateway-system
spec:
  kube:
    service:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-poc
  namespace: kgateway-system
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: cilium-poc
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      hostname: "*.poc.lab"
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [team-a, team-b]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: team-a
spec:
  parentRefs:
    - name: cilium-poc
      namespace: kgateway-system
  hostnames:
    - team-a.poc.lab
  rules:
    - backendRefs:
        - name: app
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: team-b
spec:
  parentRefs:
    - name: cilium-poc
      namespace: kgateway-system
  hostnames:
    - team-b.poc.lab
  rules:
    - backendRefs:
        - name: app
          port: 80
