<text x="32" y="68" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="start">OpenTelemetry end to end. The platform decides the tenant once; every hop has a durable buffer.</text>
