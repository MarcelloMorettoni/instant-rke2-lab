<text x="670" y="494" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="start">Azure Blob Storage (GZRS, private endpoint)</text>
<text x="670" y="514" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="start">loki-chunks/&lt;tenant&gt;/...                compressed chunks, ~1.5 MB each</text>
<text x="670" y="531" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#475569" text-anchor="start">loki-chunks/index/loki_index_&lt;day&gt;/     TSDB index, one table per day</text>
<text x="670" y="548" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"></text>
<text x="670" y="565" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">flush when a chunk is full (1.5 MB), idle 30 min, or 2 h old</text>
<text x="670" y="582" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">compactor: merges the index, applies per-tenant retention, runs deletes</text>
