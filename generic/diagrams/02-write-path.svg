<text x="68" y="546" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#115E59" text-anchor="middle">5</text>
<text x="86" y="546" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">namespace → tenant (generated)</text>
<circle cx="68" cy="578" r="10" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.5"/>
<text x="68" y="582" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#115E59" text-anchor="middle">6</text>
<text x="86" y="582" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">mask PAN / IBAN / bearer tokens</text>
<circle cx="68" cy="614" r="10" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.5"/>
<text x="68" y="618" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#115E59" text-anchor="middle">7</text>
<text x="86" y="618" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">persistent queue on node disk (2 GiB)</text>
