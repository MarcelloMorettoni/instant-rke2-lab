<text x="904" y="322" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">A push succeeds when 2 of 3 zones have it (quorum).</text>
<text x="904" y="340" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">A whole zone can fail or be upgraded: no write fails.</text>
<text x="904" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Crash → WAL replay; shutdown → flush (≤ 10 min).</text>
<text x="904" y="376" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Upgrades: rollout-operator, one zone at a time.</text>
