<text x="46" y="586" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="start">Azure Blob Storage (GZRS): one account, synchronously in all 3 zones, async copy to the paired region</text>
<text x="46" y="606" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Chunks and index are safe from any single zone failure. Loki reads and writes through one private endpoint.</text>
<rect x="32" y="648" width="580" height="92" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
<text x="46" y="672" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#166534" text-anchor="start">Zone lost: what happens</text>
<text x="46" y="692" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">writes: 2 of 3 replicas still ack (quorum) → no push fails</text>
<text x="46" y="709" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">reads: ingesters of 2 zones + Blob → complete results</text>
<text x="46" y="726" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">then: autoscaler adds nodes in the surviving zones</text>
<rect x="642" y="648" width="580" height="92" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
<text x="656" y="672" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="start">PostgreSQL (Grafana)</text>
<text x="656" y="692" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">primary zone 1, synchronous standby zone 2</text>
<text x="656" y="709" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">automatic failover ~60-120 s; Grafana reconnects</text>
<text x="656" y="726" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Loki keeps ingesting: Grafana is only the read UI</text>
