<text x="1176" y="144" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Blob GZRS: 3 zones</text>
<text x="1176" y="161" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">+ paired region</text>
<text x="1176" y="178" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"></text>
<text x="1176" y="195" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">or any S3 API</text>
<text x="1176" y="212" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">(generic)</text>
<text x="1176" y="229" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"></text>
<text x="1176" y="246" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"></text>
<path d="M1136,205 L1162,205" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#ah16A34A)"/>
<text x="358" y="338" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">survives: agent restart,</text>
<text x="358" y="354" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Kafka outage</text>
<text x="584" y="338" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">survives: node, broker or zone</text>
<text x="584" y="354" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">loss; 24 h of gateway</text>
<text x="584" y="370" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">or Loki outage</text>
<text x="810" y="338" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">survives: pod restart, one</text>
<text x="810" y="354" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">tenant at 429</text>
<text x="1036" y="338" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">survives: pod crash,</text>
<text x="1036" y="354" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">a whole zone</text>
<text x="1262" y="338" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">survives: zone loss;</text>
<text x="1262" y="354" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">region (Blob, async)</text>
<text x="32" y="418" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">WHAT KAFKA ADDS, AND WHAT IT COSTS</text>
<rect x="32" y="432" width="1336" height="30" fill="#F1F5F9" stroke="#E2E8F0"/>
<text x="44" y="451" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start"></text>
<text x="300" y="451" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">With Kafka (kafka.enabled, default)</text>
<text x="860" y="451" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">Without (overlays/no-kafka.yaml)</text>
<rect x="32" y="462" width="1336" height="30" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="44" y="481" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start">Node lost during an outage</text>
<text x="300" y="481" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">the backlog is in Kafka (replicated): only seconds lost</text>
<text x="860" y="481" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">the backlog in that node&#x27;s agent queue is lost</text>
<rect x="32" y="492" width="1336" height="30" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="44" y="511" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start">Loki down for hours</text>
<text x="300" y="511" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">24 h in Kafka for ALL tenants, replayed in order</text>
<text x="860" y="511" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">~1 h in the gateway queues, then node queues</text>
<rect x="32" y="522" width="1336" height="30" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="44" y="541" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start">Other consumers (SIEM, lake)</text>
<text x="300" y="541" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">can read the same topic (new consumer group + ACL)</text>
<text x="860" y="541" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">need a second export</text>
<rect x="32" y="552" width="1336" height="30" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="44" y="571" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start">Operations</text>
<text x="300" y="571" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">a 3rd stateful system: brokers, KRaft, upgrades, capacity</text>
<text x="860" y="571" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">two collector tiers only</text>
<rect x="32" y="582" width="1336" height="30" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="44" y="601" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="start">Tenant isolation</text>
<text x="300" y="601" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">per-tenant gateway queues; a full one pauses its partition</text>
<text x="860" y="601" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">per-tenant gateway queues</text>
<text x="32" y="640" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Decision and alternatives: docs/adr/0010-kafka-in-cluster.md (supersedes 0006).</text>
