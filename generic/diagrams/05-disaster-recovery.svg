<rect x="32" y="456" width="1176" height="34" fill="#F1F5F9" stroke="#E2E8F0"/>
<text x="48" y="478" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start"></text>
<text x="300" y="478" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="start">Tier A: rebuild (default)</text>
<text x="760" y="478" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="start">Tier B: dual-write</text>
<rect x="32" y="490" width="1176" height="34" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="48" y="512" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">RPO (logs)</text>
<text x="300" y="512" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">unflushed ≤ 2 h + Blob lag</text>
<text x="760" y="512" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">≈ 0</text>
