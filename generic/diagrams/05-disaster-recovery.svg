<text x="48" y="546" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">RTO</text>
<text x="300" y="546" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">2-4 h: infra + deploy + DNS</text>
<text x="760" y="546" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">minutes: switch Grafana</text>
<rect x="32" y="558" width="1176" height="34" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="48" y="580" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Cost</text>
<text x="300" y="580" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">storage replication only</text>
<text x="760" y="580" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">2× compute + storage</text>
<rect x="32" y="592" width="1176" height="34" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="48" y="614" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Use when</text>
<text x="300" y="614" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">logs are operational</text>
<text x="760" y="614" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">logs are records (audit)</text>
