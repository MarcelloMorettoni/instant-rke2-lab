apiVersion: apps/v1
kind: Deployment
metadata:
  name: strimzi-cluster-operator
  namespace: platform-operators
  labels:
    app: strimzi
    chart: strimzi-kafka-operator-1.2.0
    component: deployment
    release: log-platform-operators
    heritage: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      name: strimzi-cluster-operator
      strimzi.io/kind: cluster-operator
  template:
    metadata:
      labels:
        name: strimzi-cluster-operator
        strimzi.io/kind: cluster-operator
    spec:
      serviceAccountName: strimzi-cluster-operator
      automountServiceAccountToken: false
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
      - name: strimzi-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: co-config-volume
        configMap:
          name: strimzi-cluster-operator
      containers:
      - name: strimzi-cluster-operator
        image: quay.io/strimzi/operator:1.2.0
        ports:
        - containerPort: 8080
          name: http
        args:
        - /opt/strimzi/bin/cluster_operator_run.sh
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        - name: strimzi-tmp
          mountPath: /tmp
        - name: co-config-volume
          mountPath: /opt/strimzi/custom-config/
        env:
        - name: STRIMZI_NAMESPACE
          value: kafka,platform-operators
        - name: STRIMZI_FULL_RECONCILIATION_INTERVAL_MS
          value: '120000'
        - name: STRIMZI_OPERATION_TIMEOUT_MS
          value: '300000'
        - name: STRIMZI_DEFAULT_KAFKA_EXPORTER_IMAGE
          value: quay.io/strimzi/kafka:1.2.0-kafka-4.3.1
        - name: STRIMZI_DEFAULT_CRUISE_CONTROL_IMAGE
          value: quay.io/strimzi/kafka:1.2.0-kafka-4.3.1
        - name: STRIMZI_KAFKA_IMAGES
          value: '4.2.0=quay.io/strimzi/kafka:1.2.0-kafka-4.2.0

            4.2.1=quay.io/strimzi/kafka:1.2.0-kafka-4.2.1

            4.3.0=quay.io/strimzi/kafka:1.2.0-kafka-4.3.0

            4.3.1=quay.io/strimzi/kafka:1.2.0-kafka-4.3.1

            '
        - name: STRIMZI_KAFKA_CONNECT_IMAGES
          value: '4.2.0=quay.io/strimzi/kafka:1.2.0-kafka-4.2.0

            4.2.1=quay.io/strimzi/kafka:1.2.0-kafka-4.2.1

            4.3.0=quay.io/strimzi/kafka:1.2.0-kafka-4.3.0

            4.3.1=quay.io/strimzi/kafka:1.2.0-kafka-4.3.1

            '
        - name: STRIMZI_KAFKA_MIRROR_MAKER_2_IMAGES
          value: '4.2.0=quay.io/strimzi/kafka:1.2.0-kafka-4.2.0

            4.2.1=quay.io/strimzi/kafka:1.2.0-kafka-4.2.1

            4.3.0=quay.io/strimzi/kafka:1.2.0-kafka-4.3.0

            4.3.1=quay.io/strimzi/kafka:1.2.0-kafka-4.3.1

            '
        - name: STRIMZI_DEFAULT_TOPIC_OPERATOR_IMAGE
          value: quay.io/strimzi/operator:1.2.0
        - name: STRIMZI_DEFAULT_USER_OPERATOR_IMAGE
          value: quay.io/strimzi/operator:1.2.0
        - name: STRIMZI_DEFAULT_KAFKA_INIT_IMAGE
          value: quay.io/strimzi/operator:1.2.0
        - name: STRIMZI_DEFAULT_KAFKA_BRIDGE_IMAGE
          value: quay.io/strimzi/kafka-bridge:1.1.0
        - name: STRIMZI_DEFAULT_KANIKO_EXECUTOR_IMAGE
          value: quay.io/strimzi/kaniko-executor:1.2.0
        - name: STRIMZI_DEFAULT_BUILDAH_IMAGE
          value: quay.io/strimzi/buildah:1.2.0
        - name: STRIMZI_DEFAULT_MAVEN_BUILDER
          value: quay.io/strimzi/maven-builder:1.2.0
        - name: STRIMZI_OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: STRIMZI_FEATURE_GATES
          value: ''
        - name: STRIMZI_LEADER_ELECTION_ENABLED
          value: 'true'
        - name: STRIMZI_LEADER_ELECTION_LEASE_NAME
          value: strimzi-cluster-operator
        - name: STRIMZI_LEADER_ELECTION_LEASE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: STRIMZI_LEADER_ELECTION_IDENTITY
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        livenessProbe:
          httpGet:
            path: /healthy
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            cpu: 1000m
            memory: 768Mi
          requests:
            cpu: 200m
            memory: 384Mi
