# Internal load balancer for Grafana (and Keycloak): Gateway, TLS
# GENERATED by scripts/render-manifests.sh: chart log-platform, environment azure.
# Do not edit: change the chart or the environment and re-render. Secret data is redacted.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-tls
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: grafana-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ .tls | pkcs12cert }}'
        tls.key: '{{ .tls | pkcs12key }}'
  data:
  - secretKey: tls
    remoteRef:
      key: grafana-obs-tls
      decodingStrategy: Base64

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grafana-ingress
  namespace: grafana
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: grafana-ingress
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: grafana.obs-test.bank.internal
    tls:
      mode: Terminate
      certificateRefs:
      - name: grafana-tls
    allowedRoutes:
      namespaces:
        from: Same

---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: grafana-ingress
  namespace: grafana
spec:
  kube:
    deployment:
      replicas: 2
    service:
      type: LoadBalancer
      externalTrafficPolicy: Local
      extraAnnotations:
        service.beta.kubernetes.io/azure-load-balancer-internal: 'true'
        service.beta.kubernetes.io/azure-load-balancer-internal-subnet: snet-aks-ingress
    podTemplate:
      priorityClassName: observability-high
      nodeSelector:
        obs.platform/pool: loki
      tolerations:
      - effect: NoSchedule
        key: obs.platform/dedicated
        operator: Equal
        value: loki
    podDisruptionBudget:
      spec:
        minAvailable: 1

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: grafana
spec:
  parentRefs:
  - name: grafana-ingress
    sectionName: https
  hostnames:
  - grafana.obs-test.bank.internal
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: grafana
      port: 80
    timeouts:
      request: 300s
