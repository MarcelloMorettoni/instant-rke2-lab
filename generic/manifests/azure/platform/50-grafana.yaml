apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-sync
  namespace: grafana
  labels:
    app.kubernetes.io/part-of: log-platform
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: log-platform-0.1.0
spec:
  schedule: '*/10 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-sync
          annotations:
            checksum/config: 612ccdcff75477ef9a0d12d5099ff6c80f0b98ed74b7ab236ff4f1c2820202e3
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          priorityClassName: observability-high
          nodeSelector:
            obs.platform/pool: loki
          tolerations:
          - effect: NoSchedule
            key: obs.platform/dedicated
            operator: Equal
            value: loki
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: sync
            image: library/python:3.13-alpine
            command:
            - python3
            - /config/grafana-sync.py
            env:
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: GRAFANA_URL
              value: http://grafana.grafana.svc.cluster.local
            - name: READ_GATEWAY
              value: http://obs-gateway.loki.svc.cluster.local:8080
            - name: RECORDED_METRICS
              value: 'true'
            - name: GF_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: local-users
              mountPath: /local
              readOnly: true
          volumes:
          - name: config
            configMap:
              name: grafana-sync
          - name: keys
            secret:
              secretName: obs-gateway-keys
              optional: true
          - name: local-users
            secret:
              secretName: grafana-local-users

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: grafana-oauth
    creationPolicy: Owner
  data:
  - secretKey: GF_AUTH_AZUREAD_CLIENT_SECRET
    remoteRef:
      key: grafana-entra-client-secret

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: grafana
spec:
  refreshInterval: 1h
