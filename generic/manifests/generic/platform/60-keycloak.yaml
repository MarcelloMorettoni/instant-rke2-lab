apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: obs
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: log-platform
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: log-platform-0.1.0
spec:
  keycloakCRName: keycloak
  placeholders:
    GRAFANA_CLIENT_SECRET:
      secret:
        name: keycloak-grafana-client
        key: secret
    USER_INITIAL_PASSWORD:
      secret:
        name: keycloak-realm-users
        key: password
  realm:
    realm: obs
    displayName: Observability
    enabled: true
    sslRequired: external
    registrationAllowed: false
    resetPasswordAllowed: false
    bruteForceProtected: true
    ssoSessionIdleTimeout: 7200
    ssoSessionMaxLifespan: 43200
    groups:
    - name: obs-platform-viewers
    - name: obs-platform-sre
    - name: obs-payments-viewers
    - name: obs-payments-editors
    - name: obs-cards-viewers
    - name: obs-cards-editors
    - name: obs-lending-viewers
    - name: obs-lending-editors
    - name: obs-shared-services-viewers
    - name: obs-shared-services-editors
    clients:
    - clientId: grafana
      name: Grafana
      enabled: true
      protocol: openid-connect
      publicClient: false
      clientAuthenticatorType: client-secret
      secret: ${GRAFANA_CLIENT_SECRET}
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      rootUrl: https://grafana.obs-test.bank.internal
      redirectUris:
      - https://grafana.obs-test.bank.internal/login/generic_oauth
      webOrigins:
      - https://grafana.obs-test.bank.internal
      attributes:
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: https://grafana.obs-test.bank.internal/login
      protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        consentRequired: false
        config:
          full.path: 'false'
          claim.name: groups
          id.token.claim: 'true'
          access.token.claim: 'true'
          userinfo.token.claim: 'true'
    users:
    - username: alice
      enabled: true
      email: alice@obs.invalid
      emailVerified: true
      firstName: alice
      lastName: Test
      credentials:
      - type: password
        value: ${USER_INITIAL_PASSWORD}
        temporary: true
      groups:
      - /obs-payments-editors
    - username: bob
      enabled: true
      email: bob@obs.invalid
      emailVerified: true
      firstName: bob
      lastName: Test
      credentials:
      - type: password
        value: ${USER_INITIAL_PASSWORD}
        temporary: true
      groups:
      - /obs-cards-editors
    - username: carol
      enabled: true
      email: carol@obs.invalid
      emailVerified: true
      firstName: carol
      lastName: Test
      credentials:
      - type: password
        value: ${USER_INITIAL_PASSWORD}
        temporary: true
      groups:
      - /obs-lending-editors
    - username: platform
      enabled: true
      email: platform@obs.invalid
      emailVerified: true
      firstName: platform
      lastName: Test
      credentials:
      - type: password
        value: ${USER_INITIAL_PASSWORD}
        temporary: true
      groups:
      - /obs-platform-sre
