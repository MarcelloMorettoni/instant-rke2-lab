apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-platform-rollout-operator
  namespace: loki
  labels:
    helm.sh/chart: rollout-operator-0.50.0
    app.kubernetes.io/name: rollout-operator
    app.kubernetes.io/instance: log-platform
    app.kubernetes.io/version: v0.38.0
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: rollout-operator
      app.kubernetes.io/instance: log-platform
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      namespace: loki
      labels:
        app.kubernetes.io/name: rollout-operator
        app.kubernetes.io/instance: log-platform
    spec:
      priorityClassName: observability-high
      serviceAccountName: log-platform-rollout-operator
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rollout-operator
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        image: docker.io/grafana/rollout-operator:v0.38.0
        imagePullPolicy: IfNotPresent
        args:
        - -kubernetes.namespace=loki
        - -zpdb.pod-ready-annotation-patch-timeout=5s
        - -server-tls.enabled=true
        - -server-tls.self-signed-cert.secret-name=certificate
        - -server-tls.self-signed-cert.dns-name=log-platform-rollout-operator.loki.svc
        ports:
        - name: http-metrics
          containerPort: 8001
          protocol: TCP
        - name: https
          containerPort: 8443
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /ready
            port: http-metrics
          initialDelaySeconds: 5
          timeoutSeconds: 1
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
      nodeSelector:
        obs.platform/pool: loki
      tolerations:
      - effect: NoSchedule
        key: obs.platform/dedicated
        operator: Equal
        value: loki

