  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-sync
          annotations:
            checksum/config: 4c7e3871c46b5adb5b71592342ff6761dcc3a2efa23ce6d3ccb3cc9d2fe79abe
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          priorityClassName: observability-high
          nodeSelector:
            obs.platform/pool: loki
          tolerations:
          - effect: NoSchedule
            key: obs.platform/dedicated
            operator: Equal
            value: loki
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: sync
            image: library/python:3.13-alpine
            command:
            - python3
            - /config/grafana-sync.py
            env:
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: GRAFANA_URL
              value: http://grafana.grafana.svc.cluster.local
            - name: READ_GATEWAY
              value: http://obs-gateway.loki.svc.cluster.local:8080
            - name: GF_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: local-users
              mountPath: /local
              readOnly: true
          volumes:
