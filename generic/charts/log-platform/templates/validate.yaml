{{- /* Refuse to render a half-configured platform. */ -}}
{{- if ne .Release.Namespace "loki" }}
{{- fail "install this chart into namespace loki (helm -n loki): Loki's rollout-operator runs in the release namespace" }}
{{- end }}
{{- if and .Values.otelAgent.enabled (not .Values.otelAgent.alternateConfig) }}
{{- fail "otelAgent.alternateConfig is empty: add -f rendered/values-tenants.yaml (scripts/render-tenants.py)" }}
{{- end }}
{{- if and .Values.otelGateway.enabled (not .Values.otelGateway.alternateConfig) }}
{{- fail "otelGateway.alternateConfig is empty: add -f rendered/values-tenants.yaml (scripts/render-tenants.py)" }}
{{- end }}
{{- if not .Values.global.clusterName }}
{{- fail "global.clusterName is required (environments/<env>/values.yaml)" }}
{{- end }}
{{- if not .Values.keyVault.url }}
{{- fail "keyVault.url is required (environments/<env>/values.yaml)" }}
{{- end }}
{{- if and .Values.network.policies (not .Values.network.apiServerCidrs) }}
{{- fail "network.apiServerCidrs is required when network.policies is true: the OTel agents and the rollout-operator must reach the API server" }}
{{- end }}
{{- if and .Values.loki.enabled (not .Values.loki.loki.storage.azure.accountName) }}
{{- fail "loki.loki.storage.azure.accountName is required (terraform output storage_account_name)" }}
{{- end }}
{{- if and .Values.grafanaAccess.enabled (not .Values.grafanaAccess.hostname) }}
{{- fail "grafanaAccess.hostname is required when grafanaAccess.enabled" }}
{{- end }}
{{- $p := .Values.auth.provider }}
{{- if not (has $p (list "entra" "keycloak" "oidc" "disabled")) }}
{{- fail (printf "auth.provider %q: use entra, keycloak, oidc or disabled" $p) }}
{{- end }}
{{- if and (eq $p "entra") (or (not .Values.auth.entra.tenantId) (not .Values.auth.entra.clientId)) }}
{{- fail "auth.provider entra needs auth.entra.tenantId and auth.entra.clientId" }}
{{- end }}
{{- if and (eq $p "keycloak") (or (not .Values.auth.keycloak.url) (not .Values.auth.keycloak.realm) (not .Values.auth.keycloak.clientId)) }}
{{- fail "auth.provider keycloak needs auth.keycloak.url, .realm and .clientId" }}
{{- end }}
{{- if and (eq $p "oidc") (or (not .Values.auth.oidc.clientId) (not .Values.auth.oidc.authUrl) (not .Values.auth.oidc.tokenUrl) (not .Values.auth.oidc.apiUrl)) }}
{{- fail "auth.provider oidc needs auth.oidc.clientId, .authUrl, .tokenUrl and .apiUrl" }}
{{- end }}
{{- if and (ne $p "disabled") (not (index .Values.grafanaOrgMapping (ternary "entra" "oidc" (eq $p "entra"))).orgMapping) }}
{{- fail (printf "auth.provider %s: no groups for it in tenants.yaml (groups.%s), so nobody could log in" $p (ternary "entra" "oidc" (eq $p "entra"))) }}
{{- end }}
{{- if and (ne $p "disabled") (not (index .Values.grafana "grafana.ini" "server" "root_url")) }}
{{- fail "grafana.grafana.ini.server.root_url is required for SSO (the redirect URI)" }}
{{- end }}
{{- if eq $p "disabled" }}
{{- $orgs := list }}{{- range .Values.grafanaOrgs }}{{- $orgs = append $orgs .org }}{{- end }}
{{- range .Values.auth.mock.users }}
{{- if not (has .org $orgs) }}
{{- fail (printf "auth.mock.users: %s's org %q is not a tenant view (tenants.yaml, active)" .login .org) }}
{{- end }}
{{- if not (has .role (list "Viewer" "Editor")) }}
{{- fail (printf "auth.mock.users: %s's role must be Viewer or Editor" .login) }}
{{- end }}
{{- end }}
{{- end }}
