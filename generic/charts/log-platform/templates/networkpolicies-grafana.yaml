{{- if .Values.network.policies }}
# Namespace `grafana`: people in through the internal load balancer; Grafana
# out only to the read gateway, its database and Entra ID; grafana-sync only to Grafana.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: grafana}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: grafana}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    {{- include "lp.dnsEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grafana-ingress-proxy, namespace: grafana}
spec:
  podSelector:
    matchLabels: {gateway.networking.k8s.io/gateway-name: grafana-ingress}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.network.grafanaClientCidrs }}
    - from:
        {{- include "lp.cidrs" .Values.network.grafanaClientCidrs | nindent 8 }}
    {{- else }}
    - {}                                    # internal load balancer only: any internal client
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
      ports:
        - {port: 3000, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kgateway-system}
      ports:
        - {port: 9977, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grafana, namespace: grafana}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: grafana}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {gateway.networking.k8s.io/gateway-name: grafana-ingress}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana-sync}
      ports:
        - {port: 3000, protocol: TCP}
    - from:                                 # alerting HA gossip between replicas
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
      ports:
        - {port: 9094, protocol: TCP}
        - {port: 9094, protocol: UDP}
    - from:
        {{- include "lp.amaMetricsPeer" . | nindent 8 }}
      ports:
        - {port: 3000, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: loki}
          podSelector:
            matchLabels: {gateway.networking.k8s.io/gateway-name: obs-gateway}
      ports:
        - {port: 8080, protocol: TCP}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
      ports:
        - {port: 9094, protocol: TCP}
        - {port: 9094, protocol: UDP}
    {{- with .Values.network.postgresCidrs }}
    - to:
        {{- include "lp.cidrs" . | nindent 8 }}
      ports:
        - {port: 5432, protocol: TCP}
    {{- end }}
    {{- if .Values.network.internetEgress443 }}
    {{- include "lp.internet443" . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grafana-sync, namespace: grafana}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: grafana-sync}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
      ports:
        - {port: 3000, protocol: TCP}
{{- end }}
