{{- if .Values.grafanaSync.enabled }}
# Keeps every Grafana org's Loki data source on its view, with its current key.
# Runs every grafanaSync.schedule; install.sh also starts one run right away:
#   kubectl -n grafana create job --from=cronjob/grafana-sync grafana-sync-now
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-sync
  namespace: grafana
  labels:
    {{- include "lp.labels" . | nindent 4 }}
data:
  grafana-sync.py: |
    {{- .Files.Get "files/grafana-sync.py" | nindent 4 }}
  orgs.json: {{ .Values.grafanaOrgs | toJson | quote }}
  # Local people: the admin (every mode) and the mock users (disabled mode).
  # Logins, orgs and roles only; initial passwords are in Secrets.
  users.json: {{ dict "admin" .Values.auth.admin.user "users" (ternary .Values.auth.mock.users (list) (eq .Values.auth.provider "disabled")) | toJson | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-sync
  namespace: grafana
  labels:
    {{- include "lp.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.grafanaSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-sync
          annotations:
            checksum/config: {{ printf "%s%s%s" (.Files.Get "files/grafana-sync.py") (toJson .Values.grafanaOrgs) (toJson .Values.auth.mock) (toJson .Values.auth.admin) | sha256sum }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          priorityClassName: observability-high
          {{- include "lp.placement" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: sync
              image: {{ include "lp.image" (dict "ctx" . "repository" .Values.grafanaSync.image.repository "tag" .Values.grafanaSync.image.tag) }}
              command: [python3, /config/grafana-sync.py]
              env:
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
                - {name: GRAFANA_URL, value: "http://grafana.grafana.svc.cluster.local"}
                - {name: READ_GATEWAY, value: "http://obs-gateway.loki.svc.cluster.local:8080"}
                - name: GF_ADMIN_USER
                  valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-user}}
                - name: GF_ADMIN_PASSWORD
                  valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-password}}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: keys, mountPath: /keys, readOnly: true}
                - {name: local-users, mountPath: /local, readOnly: true}
                {{- if .Values.auth.admin.fromKeyVault }}
                - {name: breakglass, mountPath: /breakglass, readOnly: true}
                {{- end }}
          volumes:
            - name: config
              configMap: {name: grafana-sync}
            - name: keys
              secret: {secretName: obs-gateway-keys, optional: true}
            - name: local-users
              secret: {secretName: grafana-local-users}
            {{- if .Values.auth.admin.fromKeyVault }}
            - name: breakglass
              secret: {secretName: grafana-breakglass, optional: true}
            {{- end }}
{{- end }}
