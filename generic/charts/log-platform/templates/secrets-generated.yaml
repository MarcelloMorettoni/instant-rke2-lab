{{- /*
Secrets the chart makes itself. Generated values are created once and then
kept across upgrades (Helm lookup of the existing Secret). `helm template`
cannot look up, so it prints fresh random values: only `helm upgrade --install`
against the cluster keeps them.
  - keyVault.enabled false: the read-gateway view keys
  - keycloak.install:       the Grafana client secret (realm ↔ Grafana), lab users' initial password
  - TLS selfSigned:         grafana-tls, keycloak-tls
  - postgres.provider percona: copies of the Percona pguser Secrets
Kafka's credentials: templates/kafka.yaml.
*/ -}}
{{- if not .Values.keyVault.enabled }}
{{- /* ---------------------------------------------------------- view keys */ -}}
{{- $keys := dict }}
{{- range $v := .Values.readViews }}
{{- $old := include "lp.existing" (list $ "loki" (printf "obs-key-%s" $v.view)) | fromYaml }}
{{- $_ := set $keys $v.view (index $old $v.view | default (randAlphaNum 40 | b64enc)) }}
---
# The view's key (kgateway apiKeyAuth: key name = client, value = API key).
apiVersion: v1
kind: Secret
metadata:
  name: obs-key-{{ $v.view }}
  namespace: loki
  labels:
    {{- include "lp.labels" $ | nindent 4 }}
    obs.platform/view: {{ $v.view }}
type: Opaque
data:
  {{ $v.view }}: {{ index $keys $v.view | quote }}
{{- end }}
---
# Every view key in one Secret, for grafana-sync (files obs-key-<view>).
apiVersion: v1
kind: Secret
metadata:
  name: obs-gateway-keys
  namespace: grafana
  labels:
    {{- include "lp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $view, $key := $keys }}
  obs-key-{{ $view }}: {{ $key | quote }}
  {{- end }}
{{- end }}
{{- if .Values.keycloak.install }}
{{- /* ---------------------------------------------------------- Keycloak ↔ Grafana */ -}}
{{- $old := include "lp.existing" (list . "keycloak" "keycloak-grafana-client") | fromYaml }}
{{- $secret := index $old "secret" | default (randAlphaNum 40 | b64enc) }}
---
# The realm's grafana client secret (KeycloakRealmImport placeholder) ...
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-grafana-client
  namespace: keycloak
  labels:
    {{- include "lp.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ $secret | quote }}
---
# ... and the same value on Grafana's side.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oauth
  namespace: grafana
  labels:
    {{- include "lp.labels" . | nindent 4 }}
type: Opaque
data:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ $secret | quote }}
{{- if .Values.keycloak.realm.users }}
---
# INITIAL password of keycloak.realm.users: temporary, Keycloak asks for a new one at first login.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-realm-users
  namespace: keycloak
  labels:
    {{- include "lp.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.keycloak.realm.initialPassword | default (randAlphaNum 24) | b64enc | quote }}
{{- end }}
{{- end }}
{{- /* ---------------------------------------------------------- self-signed TLS */ -}}
{{- $tls := list }}
{{- $ga := .Values.grafanaAccess }}
{{- if and $ga.enabled (not $ga.tls.fromKeyVault) $ga.tls.selfSigned }}
{{- $tls = append $tls (list "grafana-tls" $ga.hostname) }}
{{- end }}
{{- if and $ga.enabled .Values.keycloak.install (not .Values.keycloak.tls.fromKeyVault) .Values.keycloak.tls.selfSigned }}
{{- $tls = append $tls (list "keycloak-tls" .Values.keycloak.hostname) }}
{{- end }}
{{- range $t := $tls }}
{{- $old := include "lp.existing" (list $ "grafana" (index $t 0)) | fromYaml }}
{{- $crt := index $old "tls.crt" }}{{- $key := index $old "tls.key" }}
{{- if not (and $crt $key) }}
{{- $c := genSelfSignedCert (index $t 1) nil (list (index $t 1)) 825 }}
{{- $crt = $c.Cert | b64enc }}{{- $key = $c.Key | b64enc }}
{{- end }}
---
# SELF-SIGNED certificate for {{ index $t 1 }} (browsers warn). For real use,
# set tls.fromKeyVault, or tls.selfSigned: false and create this Secret yourself.
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $t 0 }}
  namespace: grafana
  labels:
    {{- include "lp.labels" $ | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | quote }}
  tls.key: {{ $key | quote }}
{{- end }}
{{- if eq .Values.postgres.provider "percona" }}
{{- /* ---------------------------------------------------------- Percona PostgreSQL */ -}}
{{- $pc := .Values.postgres.percona }}
{{- $copies := list (list "grafana" .Values.global.grafanaDatabase.secretName $pc.grafanaUser) }}
{{- if .Values.keycloak.install }}
{{- $copies = append $copies (list "keycloak" "keycloak-db" $pc.keycloakUser) }}
{{- end }}
{{- range $c := $copies }}
{{- $src := printf "%s-pguser-%s" $pc.cluster (index $c 2) }}
{{- $data := (lookup "v1" "Secret" $pc.namespace $src).data }}
{{- if $data }}
---
# Copy of {{ $pc.namespace }}/{{ $src }} (Percona operator). Re-run the chart
# after changing that user's password.
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $c 1 }}
  namespace: {{ index $c 0 }}
  labels:
    {{- include "lp.labels" $ | nindent 4 }}
  annotations:
    obs.platform/copied-from: {{ printf "%s/%s" $pc.namespace $src }}
type: Opaque
data:
  {{- range $key := list "host" "port" "dbname" "user" "password" }}
  {{ $key }}: {{ index $data $key | default "" | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
