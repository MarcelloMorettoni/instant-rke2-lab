{{- if .Values.keyVault.enabled }}
{{- /*
Key Vault → Kubernetes Secrets, with Workload Identity (the ESO service
account is federated with the id-eso-* managed identity; Terraform).
Without Key Vault (keyVault.enabled: false): templates/secrets-generated.yaml.
*/ -}}
{{- $p := .Values.auth.provider }}
{{- $store := dict "kind" "ClusterSecretStore" "name" .Values.keyVault.storeName }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.keyVault.storeName }}
spec:
  conditions:
    - namespaces: [loki, grafana{{ if .Values.keycloak.install }}, keycloak{{ end }}]   # only the platform may use this store
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ .Values.keyVault.url | quote }}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
{{- if .Values.auth.admin.fromKeyVault }}
---
# The local admin's INITIAL password from Key Vault (auth.admin.fromKeyVault).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: grafana-breakglass, namespace: grafana}
spec:
  refreshInterval: 1h
  secretStoreRef: {{ toJson $store }}
  target: {name: grafana-breakglass, creationPolicy: Owner}
  data:
    - secretKey: password
      remoteRef: {key: grafana-admin-password}
{{- end }}
{{- if and (ne $p "disabled") (not .Values.auth.publicClient) (not .Values.keycloak.install) }}
---
# The OAuth client secret (with keycloak.install the chart generates it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: grafana-oauth, namespace: grafana}
spec:
  refreshInterval: 1h
  secretStoreRef: {{ toJson $store }}
  target: {name: grafana-oauth, creationPolicy: Owner}
  data:
    - secretKey: {{ ternary "GF_AUTH_AZUREAD_CLIENT_SECRET" "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET" (eq $p "entra") }}
      remoteRef:
        key: {{ .Values.auth.clientSecretKeyVaultName | default (ternary "grafana-entra-client-secret" "grafana-oidc-client-secret" (eq $p "entra")) }}
{{- end }}
{{- if eq .Values.postgres.provider "azure" }}
{{- $pg := .Values.postgres.azure }}
{{- range $app := list "grafana" "keycloak" }}
{{- if or (eq $app "grafana") $.Values.keycloak.install }}
{{- $db := index $pg $app }}
---
# {{ $app }}'s database: Azure Database for PostgreSQL, password from Key Vault.
# Same keys as a Percona pguser Secret: host, port, dbname, user, password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ $app }}-db, namespace: {{ $app }}}
spec:
  refreshInterval: 1h
  secretStoreRef: {{ toJson $store }}
  target:
    name: {{ ternary $.Values.global.grafanaDatabase.secretName "keycloak-db" (eq $app "grafana") }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        host: {{ $pg.host | quote }}
        port: {{ $pg.port | toString | quote }}
        dbname: {{ $db.database | quote }}
        user: {{ $db.user | quote }}
        password: '{{ "{{" }} .password {{ "}}" }}'
  data:
    - secretKey: password
      remoteRef: {key: {{ $db.passwordKeyVaultName }}}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.keycloak.install .Values.keycloak.realm.entraBroker.enabled }}
---
# Keycloak's client secret at Entra ID (identity brokering).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: keycloak-entra, namespace: keycloak}
spec:
  refreshInterval: 1h
  secretStoreRef: {{ toJson $store }}
  target: {name: keycloak-entra, creationPolicy: Owner}
  data:
    - secretKey: client-secret
      remoteRef: {key: keycloak-entra-client-secret}
{{- end }}
---
# Every view key in one Secret, for grafana-sync (files obs-key-<view>).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: obs-gateway-keys, namespace: grafana}
spec:
  refreshInterval: 15m
  secretStoreRef: {{ toJson $store }}
  target: {name: obs-gateway-keys, creationPolicy: Owner}
  dataFrom:
    - find:
        name:
          regexp: "^obs-key-.+"
{{- range $v := .Values.readViews }}
---
# The view's key lives only in Key Vault (scripts/tenant-keys.sh creates it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obs-key-{{ $v.view }}
  namespace: loki
  labels:
    obs.platform/view: {{ $v.view }}
spec:
  refreshInterval: 15m
  secretStoreRef: {{ toJson $store }}
  target: {name: obs-key-{{ $v.view }}, creationPolicy: Owner}
  data:
    - secretKey: {{ $v.view }}
      remoteRef: {key: obs-key-{{ $v.view }}}
{{- end }}
{{- /* TLS certificates (a Key Vault certificate is read as its PFX secret). */ -}}
{{- $certs := list }}
{{- if and .Values.grafanaAccess.enabled .Values.grafanaAccess.tls.fromKeyVault }}
{{- $certs = append $certs (list "grafana-tls" .Values.grafanaAccess.tls.keyVaultCertificate) }}
{{- end }}
{{- if and .Values.grafanaAccess.enabled .Values.keycloak.install .Values.keycloak.tls.fromKeyVault }}
{{- $certs = append $certs (list "keycloak-tls" .Values.keycloak.tls.keyVaultCertificate) }}
{{- end }}
{{- range $c := $certs }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ index $c 0 }}, namespace: grafana}
spec:
  refreshInterval: 1h
  secretStoreRef: {{ toJson $store }}
  target:
    name: {{ index $c 0 }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ "{{" }} .tls | pkcs12cert {{ "}}" }}'
        tls.key: '{{ "{{" }} .tls | pkcs12key {{ "}}" }}'
  data:
    - secretKey: tls
      remoteRef:
        key: {{ index $c 1 }}
        decodingStrategy: Base64
{{- end }}
{{- end }}
