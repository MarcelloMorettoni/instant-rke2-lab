# Key Vault → Kubernetes Secrets, with Workload Identity (the ESO service
# account is federated with the id-eso-* managed identity; Terraform).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.keyVault.storeName }}
spec:
  conditions:
    - namespaces: [loki, grafana]       # only the platform may use this store
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ .Values.keyVault.url | quote }}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
{{- if .Values.auth.admin.fromKeyVault }}
---
# The local admin's INITIAL password from Key Vault (auth.admin.fromKeyVault).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: grafana-breakglass, namespace: grafana}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.keyVault.storeName }}}
  target: {name: grafana-breakglass, creationPolicy: Owner}
  data:
    - secretKey: password
      remoteRef: {key: grafana-admin-password}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: grafana-env, namespace: grafana}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.keyVault.storeName }}}
  target: {name: grafana-env, creationPolicy: Owner}
  data:
    - secretKey: GF_DATABASE_PASSWORD
      remoteRef: {key: grafana-db-password}
    {{- $p := .Values.auth.provider }}
    {{- if and (ne $p "disabled") (not .Values.auth.publicClient) }}
    - secretKey: {{ ternary "GF_AUTH_AZUREAD_CLIENT_SECRET" "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET" (eq $p "entra") }}
      remoteRef:
        key: {{ .Values.auth.clientSecretKeyVaultName | default (ternary "grafana-entra-client-secret" "grafana-oidc-client-secret" (eq $p "entra")) }}
    {{- end }}
---
# Every view key in one Secret, for grafana-sync (files obs-key-<view>).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: obs-gateway-keys, namespace: grafana}
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.keyVault.storeName }}}
  target: {name: obs-gateway-keys, creationPolicy: Owner}
  dataFrom:
    - find:
        name:
          regexp: "^obs-key-.+"
{{- if and .Values.grafanaAccess.enabled .Values.grafanaAccess.tls.fromKeyVault }}
---
# TLS certificate (a Key Vault certificate is read as its PFX secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: grafana-tls, namespace: grafana}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: {{ .Values.keyVault.storeName }}}
  target:
    name: grafana-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ "{{" }} .tls | pkcs12cert {{ "}}" }}'
        tls.key: '{{ "{{" }} .tls | pkcs12key {{ "}}" }}'
  data:
    - secretKey: tls
      remoteRef:
        key: {{ .Values.grafanaAccess.tls.keyVaultCertificate }}
        decodingStrategy: Base64
{{- end }}
