apiVersion: v2
name: log-platform
description: >-
  Multi-tenant Loki on AKS with OpenTelemetry collection: Loki (distributed,
  zone-aware), OTel agent + gateway, Grafana, and the platform's own objects
  (namespaces, NetworkPolicies, read gateway, per-tenant views, External
  Secrets, Grafana org sync). Requires the log-platform-operators chart first.
type: application
version: 0.1.0
appVersion: "1.0"
dependencies:
  - name: loki
    version: 7.3.0
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
  - name: opentelemetry-collector
    alias: otelAgent
    version: 0.173.1
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otelAgent.enabled
  - name: opentelemetry-collector
    alias: otelGateway
    version: 0.173.1
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otelGateway.enabled
  - name: grafana
    version: 13.2.5
    repository: https://grafana-community.github.io/helm-charts
    condition: grafana.enabled
