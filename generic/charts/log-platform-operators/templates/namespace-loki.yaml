# The log-platform release is installed INTO `loki` (Loki's rollout-operator
# only works in its release namespace), so that release can't create it. It
# is created here, first, with the platform's Pod Security labels.
apiVersion: v1
kind: Namespace
metadata:
  name: loki
  labels:
    app.kubernetes.io/part-of: log-platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    helm.sh/resource-policy: keep                  # uninstalling the operators never deletes the logs' namespace
