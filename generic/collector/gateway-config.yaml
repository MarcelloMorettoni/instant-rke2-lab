# OpenTelemetry Collector GATEWAY: a StatefulSet, 3 pods across zones.
#
# TEMPLATE: scripts/render-tenants.py adds the routing table, one exporter and
# one pipeline per tenant, and writes it, as otelGateway.alternateConfig, into
# rendered/values-tenants.yaml.
#
# Input: the Kafka topic otel-logs (consumer group otel-gateway), or, without
# Kafka (environments/overlays/no-kafka.yaml), OTLP from the agents.
# Only the agents can write there (Kafka ACLs, NetworkPolicy): obs.tenant is
# trusted here because only the agents set it. Each tenant gets its own
# exporter with its own PERSISTENT queue on the pod's disk, so:
#   - one tenant over its Loki limit (429) only backs up its own queue;
#   - the other tenants keep flowing;
#   - a Loki outage is absorbed on disk (per tenant, up to queue_size).
extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: true
    compaction:
      on_start: true
      on_rebound: true
      directory: /var/lib/otelcol/queue

receivers:
  # The gateways share the topic's partitions (consumer group). An offset is
  # committed only after the record is in its tenant's queue (message_marking):
  # if that queue is full, the partition pauses and retries (error_backoff);
  # the records stay in Kafka. Malformed records (permanent errors) are skipped.
  kafka:
    brokers: [logs-kafka-bootstrap.kafka.svc.cluster.local:9093]
    client_id: otel-gateway
    group_id: otel-gateway
    initial_offset: earliest
    logs:
      topics: [otel-logs]
      encoding: otlp_proto
    max_partition_fetch_size: 8388608
    auth:
      sasl:
        mechanism: SCRAM-SHA-512
        username: otel-gateway
        password: ${env:KAFKA_PASSWORD}
    tls:
      ca_file: /etc/kafka-client/ca.crt
    message_marking:
      after: true
      on_error: false
      on_permanent_error: true
    error_backoff:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    partition_processing:
      independent: true                # one worker per partition: a slow one doesn't hold the others
  otlp:
    protocols:
      grpc:
        endpoint: ${env:MY_POD_IP}:4317
        max_recv_msg_size_mib: 32

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/internal:
    attributes:
      - {key: obs.tenant, action: delete}

connectors:
  routing:
    default_pipelines: [logs/unassigned]
    table: []                          # @@ROUTES@@

exporters: {}                          # @@EXPORTERS@@ one otlp_http/<tenant> each, like:
#  otlp_http/payments:
#    endpoint: http://loki-distributor.loki.svc.cluster.local:3100/otlp
#    headers: {X-Scope-OrgID: payments}
#    sending_queue: {storage: file_storage, sizer: bytes, queue_size: ...}

service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:MY_POD_IP}
                port: 8888
  pipelines:
    logs/in:
      receivers: [kafka]
      processors: [memory_limiter]
      exporters: [routing]
    # @@PIPELINES@@ logs/<tenant>: routing → resource/internal → otlp_http/<tenant>
