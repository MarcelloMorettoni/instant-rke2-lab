{{- if .Values.network.ciliumPolicies }}
{{- $ns := .Release.Namespace }}
{{- $envoy := dict "gateway.networking.k8s.io/gateway-name" "obs-gateway" }}
# Step 7, network.
#   Grafana, demonstrator ──:8080──► read gateway (Envoy) ──► query frontends :3100, tenant guard :8080
#   Envoy ◄──config (xDS :9977)── the cluster's kgateway controller
#   tenant guard ──► metrics store :9090 ◄── Loki ruler (remote write)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: read-gateway
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- toYaml $envoy | nindent 6 }}
  ingress:
    {{- include "demo.fromNode" . | nindent 4 }}
    {{- include "demo.from" (dict "ns" $ns "labels" (dict "app.kubernetes.io/name" "grafana") "ports" (list 8080)) | nindent 4 }}
    {{- include "demo.fromDemonstrator" (list . (list 8080)) | nindent 4 }}
  egress:
    {{- include "demo.toDNS" . | nindent 4 }}
    {{- include "demo.to" (dict "ns" .Values.readGateway.controllerNamespace "labels" .Values.readGateway.controllerLabels "ports" (list 9977)) | nindent 4 }}
    {{- include "demo.to" (dict "ns" $ns "labels" (dict "app.kubernetes.io/name" "loki" "app.kubernetes.io/component" "query-frontend") "ports" (list 3100)) | nindent 4 }}
    {{- include "demo.to" (dict "ns" $ns "labels" (dict "app.kubernetes.io/name" "obs-metrics-proxy") "ports" (list 8080)) | nindent 4 }}
{{- if .Values.network.controllerIngressPolicy }}
---
# In the kgateway controller's namespace: let the demo's Envoy pods fetch
# their configuration. Adds an allow; changes nothing else there.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $ns }}-read-gateway-xds
  namespace: {{ .Values.readGateway.controllerNamespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- toYaml .Values.readGateway.controllerLabels | nindent 6 }}
  ingress:
    {{- include "demo.from" (dict "ns" $ns "labels" $envoy "ports" (list 9977)) | nindent 4 }}
{{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tenant-guard
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: obs-metrics-proxy}
  ingress:
    {{- include "demo.fromNode" . | nindent 4 }}
    {{- include "demo.from" (dict "ns" $ns "labels" $envoy "ports" (list 8080)) | nindent 4 }}
  egress:
    {{- include "demo.toDNS" . | nindent 4 }}
    {{- include "demo.to" (dict "ns" $ns "labels" (dict "app.kubernetes.io/name" "obs-metrics") "ports" (list 9090)) | nindent 4 }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-store
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: obs-metrics}
  ingress:
    {{- include "demo.fromNode" . | nindent 4 }}
    {{- include "demo.from" (dict "ns" $ns "labels" (dict "app.kubernetes.io/name" "obs-metrics-proxy") "ports" (list 9090)) | nindent 4 }}
    {{- include "demo.from" (dict "ns" $ns "labels" (dict "app.kubernetes.io/name" "loki" "app.kubernetes.io/component" "ruler") "ports" (list 9090)) | nindent 4 }}
    {{- include "demo.fromDemonstrator" (list . (list 9090)) | nindent 4 }}
  egress:
    {{- include "demo.toDNS" . | nindent 4 }}
{{- end }}
