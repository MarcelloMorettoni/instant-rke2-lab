# Step 3. Object storage: where Loki keeps every chunk and index file.
# SeaweedFS, one pod, S3 API on :8333. Production: Azure Blob or the bank's S3.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: seaweedfs
spec:
  selector: {app.kubernetes.io/name: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: s3}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: seaweedfs
spec:
  replicas: 1
  serviceName: seaweedfs
  selector:
    matchLabels: {app.kubernetes.io/name: seaweedfs}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seaweedfs, app.kubernetes.io/part-of: log-flow-demo}
    spec:
      containers:
        - name: seaweedfs
          image: {{ include "demo.image" (dict "ctx" . "img" .Values.images.seaweedfs) }}
          args: [server, -s3, -dir=/data, -volume.max=0, -master.volumeSizeLimitMB=256, -ip.bind=0.0.0.0]
          ports:
            - {name: s3, containerPort: 8333}
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.objectStorage.size }}}}
---
# The buckets Loki writes to (created once; retried until SeaweedFS is up).
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-buckets
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: buckets
          image: {{ include "demo.image" (dict "ctx" . "img" .Values.images.python) }}
          command:
            - python3
            - -c
            - |
              import time, urllib.request
              for bucket in ("loki-chunks", "loki-ruler", "loki-admin"):
                  for attempt in range(60):
                      try:
                          req = urllib.request.Request(f"http://seaweedfs:8333/{bucket}", method="PUT")
                          print(bucket, urllib.request.urlopen(req, timeout=10).status, flush=True)
                          break
                      except Exception as e:
                          print(bucket, "not yet:", e, flush=True)
                          time.sleep(5)
                  else:
                      raise SystemExit(f"could not create {bucket}")
          resources:
            requests: {cpu: 10m, memory: 32Mi}
