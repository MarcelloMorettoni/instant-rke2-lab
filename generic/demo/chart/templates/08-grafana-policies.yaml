{{- if .Values.network.ciliumPolicies }}
{{- $ns := .Release.Namespace }}
# Step 8, network. People reach Grafana with kubectl port-forward (through the
# kubelet, not the pod network). Grafana reads logs only through the read
# gateway; grafana-sync talks only to Grafana.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: grafana}
  ingress:
    {{- include "demo.fromNode" . | nindent 4 }}
    {{- include "demo.from" (dict "ns" $ns "labels" (dict "app.kubernetes.io/name" "grafana-sync") "ports" (list 3000)) | nindent 4 }}
  egress:
    {{- include "demo.toDNS" . | nindent 4 }}
    {{- include "demo.to" (dict "ns" $ns "labels" (dict "gateway.networking.k8s.io/gateway-name" "obs-gateway") "ports" (list 8080)) | nindent 4 }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-sync
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: grafana-sync}
  egress:
    {{- include "demo.toDNS" . | nindent 4 }}
    {{- include "demo.to" (dict "ns" $ns "labels" (dict "app.kubernetes.io/name" "grafana") "ports" (list 3000)) | nindent 4 }}
{{- end }}
