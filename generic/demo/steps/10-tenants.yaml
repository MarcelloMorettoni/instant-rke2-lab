    metadata:
      # app.kubernetes.io/name becomes the logs' service_name (the agent's rule).
      labels: {app.kubernetes.io/name: payments, app.kubernetes.io/component: emitter, app.kubernetes.io/part-of: log-flow-demo}
      annotations:
        checksum/code: 18c264d22bcb858073ac7238ac762961659da92201693c0b638f5f56ed9a3a85
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: payments
          image: library/python:3.13-alpine
          command: [python3, -u, /app/emitter.py, "8080"]
          env:
            - {name: APP, value: "payments"}
            - {name: OTEL_AGENT_URL, value: "http://otel-agent.observability.svc.cluster.local:4318/v1/logs"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
