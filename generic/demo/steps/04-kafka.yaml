# Source: log-flow-demo/templates/04-kafka.yaml
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: logs
  labels:
    app.kubernetes.io/part-of: log-flow-demo
    app.kubernetes.io/managed-by: Helm
spec:
  kafka:
    version: "4.3.1"
    listeners:
      - {name: plain, port: 9092, type: internal, tls: false}
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
      message.max.bytes: 8388608
  entityOperator:
    topicOperator:
      resources: {requests: {cpu: 20m, memory: 256Mi}, limits: {memory: 512Mi}}
  # Partition leaders, replicas and offsets as metrics: the demonstrator reads them.
  kafkaExporter:
    topicRegex: otel-logs
    groupRegex: ".*"
    resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
