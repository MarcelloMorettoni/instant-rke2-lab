# Source: log-flow-demo/templates/04-kafka.yaml
# Kafka's HTTP bridge: lets the demonstrator READ the topic (its own consumer
# group) to show where a traced line landed: partition, offset, key.
apiVersion: kafka.strimzi.io/v1
kind: KafkaBridge
metadata:
  name: logs
  labels:
    app.kubernetes.io/part-of: log-flow-demo
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  bootstrapServers: logs-kafka-bootstrap:9092
  http:
    port: 8080
  resources:
    requests: {cpu: 20m, memory: 256Mi}
    limits: {memory: 512Mi}
---
# Source: log-flow-demo/templates/04-kafka.yaml
# Step 4. Kafka (run by the Strimzi operator from step 2): the buffer between
# the OTel agents (producers) and the OTel gateways (one consumer group).
# 3 nodes (KRaft controller + broker each); every partition on all 3.
# Production adds TLS + SCRAM users with ACLs (generic/charts/log-platform).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  labels:
    app.kubernetes.io/part-of: log-flow-demo
    app.kubernetes.io/managed-by: Helm
    strimzi.io/cluster: logs
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        deleteClaim: true
        kraftMetadata: shared
  resources:
    requests: {cpu: 100m, memory: 768Mi}
    limits: {memory: 1Gi}
  jvmOptions: {"-Xms": 256m, "-Xmx": 512m}
---
# Source: log-flow-demo/templates/04-kafka.yaml
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otel-logs
  labels:
    app.kubernetes.io/part-of: log-flow-demo
    app.kubernetes.io/managed-by: Helm
    strimzi.io/cluster: logs
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 21600000
    min.insync.replicas: 2
    max.message.bytes: 8388608
