# Source: log-flow-demo/templates/04-kafka.yaml
# Kafka's HTTP bridge: lets the demonstrator READ the topic (its own consumer
# group) to show where a traced line landed: partition, offset, key.
apiVersion: kafka.strimzi.io/v1
kind: KafkaBridge
metadata:
  namespace: observability
  name: logs
  labels:
    app.kubernetes.io/part-of: log-flow-demo
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  bootstrapServers: logs-kafka-bootstrap:9092
  http:
    port: 8080
  resources:
    requests: {cpu: 20m, memory: 256Mi}
    limits: {memory: 512Mi}
