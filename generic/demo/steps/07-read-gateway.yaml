# Envoy's access log (tenant, path, status): visible in the platform org.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  namespace: observability
  name: obs-gateway
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: obs-gateway}
  default:
    httpSettings:
      accessLog:
        - fileSink:
            path: /dev/stdout
            stringFormat: >
