apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent
  labels:
    app.kubernetes.io/part-of: log-flow-demo
    app.kubernetes.io/managed-by: Helm
data:
  relay.yaml: |
    exporters:
      kafka:
        brokers:
        - logs-kafka-bootstrap.observability.svc.cluster.local:9092
        client_id: otel-agent
        logs:
          encoding: otlp_proto
          topic: otel-logs
        partition_logs_by_resource_attributes: true
        producer:
          allow_auto_topic_creation: false
          compression: zstd
          max_message_bytes: 8388608
          required_acks: -1
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_elapsed_time: 0s
          max_interval: 60s
        sending_queue:
          batch:
            flush_timeout: 1s
            max_size: 4194304
            min_size: 524288
            sizer: bytes
          enabled: true
          num_consumers: 8
          queue_size: 268435456
          sizer: bytes
          storage: file_storage
        timeout: 30s
    extensions:
      file_storage:
        compaction:
          directory: /var/lib/otelcol-demo/storage
          on_rebound: true
          on_start: true
        create_directory: true
        directory: /var/lib/otelcol-demo/storage
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      k8s_attributes/files:
        auth_type: serviceAccount
        extract:
          labels:
          - from: pod
            key: app.kubernetes.io/name
            tag_name: app
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
        filter:
          node_from_env_var: K8S_NODE_NAME
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      k8s_attributes/otlp:
        auth_type: serviceAccount
        extract:
          labels:
          - from: pod
            key: app.kubernetes.io/name
            tag_name: app
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
        filter:
          node_from_env_var: K8S_NODE_NAME
        passthrough: false
        pod_association:
        - sources:
          - from: connection
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/cluster:
        attributes:
        - action: upsert
          key: k8s.cluster.name
          value: ${env:CLUSTER_NAME}
        - action: delete
          key: log.file.path
      resource/untrusted:
        attributes:
        - action: delete
          key: obs.tenant
        - action: delete
          key: k8s.cluster.name
        - action: delete
          key: k8s.namespace.name
        - action: delete
          key: k8s.pod.name
        - action: delete
          key: k8s.pod.uid
        - action: delete
          key: k8s.pod.ip
        - action: delete
          key: k8s.node.name
        - action: delete
          key: k8s.deployment.name
        - action: delete
          key: k8s.statefulset.name
        - action: delete
          key: k8s.daemonset.name
        - action: delete
          key: k8s.container.name
      transform/mask:
        error_mode: ignore
        log_statements:
        - context: log
          statements:
          - replace_pattern(log.body, "\\b[3-6]\\d{8,11}(\\d{4})\\b", "************$${1}")
            where IsString(log.body)
          - replace_all_patterns(log.attributes, "value", "\\b[3-6]\\d{8,11}(\\d{4})\\b",
            "************$${1}")
          - replace_pattern(log.body, "\\b([A-Z]{2}\\d{2})[A-Z0-9]{7,26}([A-Z0-9]{4})\\b",
            "$${1}****$${2}") where IsString(log.body)
          - replace_all_patterns(log.attributes, "value", "\\b([A-Z]{2}\\d{2})[A-Z0-9]{7,26}([A-Z0-9]{4})\\b",
            "$${1}****$${2}")
          - replace_pattern(log.body, "(?i)(authorization[\"']?\\s*[:=]\\s*[\"']?(?:bearer|basic)\\s+)[A-Za-z0-9._~+/=-]+",
            "$${1}<redacted>") where IsString(log.body)
          - replace_all_patterns(log.attributes, "value", "(?i)((?:bearer|basic)\\s+)[A-Za-z0-9._~+/=-]+",
            "$${1}<redacted>")
      transform/service_name:
        error_mode: ignore
        log_statements:
        - context: resource
          statements:
          - set(resource.attributes["service.name"], resource.attributes["app"]) where
            resource.attributes["service.name"] == nil and resource.attributes["app"]
            != nil
          - set(resource.attributes["service.name"], resource.attributes["k8s.container.name"])
            where resource.attributes["service.name"] == nil
          - delete_key(resource.attributes, "app")
      transform/tenant:
        error_mode: propagate
        log_statements:
        - context: resource
          statements:
          - set(resource.attributes["obs.tenant"], "unassigned")
          - set(resource.attributes["obs.tenant"], "platform") where resource.attributes["k8s.namespace.name"]
            != nil and IsMatch(resource.attributes["k8s.namespace.name"], "^(observability)$")
          - set(resource.attributes["obs.tenant"], "tenant-a") where resource.attributes["k8s.namespace.name"]
            != nil and IsMatch(resource.attributes["k8s.namespace.name"], "^(tenant-a)$")
          - set(resource.attributes["obs.tenant"], "tenant-b") where resource.attributes["k8s.namespace.name"]
            != nil and IsMatch(resource.attributes["k8s.namespace.name"], "^(tenant-b)$")
          - set(resource.attributes["obs.tenant"], "tenant-c") where resource.attributes["k8s.namespace.name"]
            != nil and IsMatch(resource.attributes["k8s.namespace.name"], "^(tenant-c)$")
    receivers:
      file_log:
        exclude:
        - /var/log/pods/observability_otel-agent-*/*/*.log
        include:
        - /var/log/pods/observability_*/*/*.log
        - /var/log/pods/tenant-a_*/*/*.log
        - /var/log/pods/tenant-b_*/*/*.log
        - /var/log/pods/tenant-c_*/*/*.log
        include_file_name: false
        include_file_path: true
        max_log_size: 256KiB
        operators:
        - add_metadata_from_filepath: true
          id: container-parser
          type: container
        retry_on_failure:
          enabled: true
        start_at: end
        storage: file_storage
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
            max_recv_msg_size_mib: 16
          http:
            endpoint: ${env:MY_POD_IP}:4318
    service:
      extensions:
      - health_check
      - file_storage
      pipelines:
        logs/files:
          exporters:
          - kafka
          processors:
          - memory_limiter
          - k8s_attributes/files
          - resource/cluster
          - transform/service_name
          - transform/tenant
          - transform/mask
          receivers:
          - file_log
        logs/otlp:
          exporters:
          - kafka
          processors:
          - memory_limiter
          - resource/untrusted
          - k8s_attributes/otlp
          - resource/cluster
          - transform/service_name
          - transform/tenant
          - transform/mask
          receivers:
          - otlp
      telemetry:
        logs:
          level: warn
        metrics:
          level: detailed
          readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
