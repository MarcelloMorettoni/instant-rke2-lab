          readinessProbe:
            httpGet: {path: /, port: 13133}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [DAC_READ_SEARCH]}
          volumeMounts:
            - {name: config, mountPath: /conf}
            - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
            - {name: otelcol-data, mountPath: /var/lib/otelcol-demo}
      volumes:
        - name: config
          configMap: {name: otel-agent}
        - name: varlogpods
          hostPath: {path: /var/log/pods}
        - name: otelcol-data
          hostPath: {path: /var/lib/otelcol-demo, type: DirectoryOrCreate}
