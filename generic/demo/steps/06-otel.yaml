spec:
  selector:
    matchLabels: {app.kubernetes.io/name: otel-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-agent, app.kubernetes.io/part-of: log-flow-demo}
      annotations:
        checksum/config: 20b19a64069cb6a43bd8fba01a2ebad8c9566776e4167bfdee54f5cac08ace7b
    spec:
      serviceAccountName: otel-agent
      tolerations:
        - operator: Exists
      containers:
        - name: otel-agent
          image: otel/opentelemetry-collector-contrib:0.160.0
          command: [/otelcol-contrib, --config=/conf/relay.yaml]
          env:
            - name: MY_POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: K8S_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: CLUSTER_NAME, value: "demo"}
