# Source: log-flow-demo/templates/03-object-storage.yaml
# The buckets Loki writes to (created once; retried until SeaweedFS is up).
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-buckets
  labels:
    app.kubernetes.io/part-of: log-flow-demo
    app.kubernetes.io/managed-by: Helm
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: buckets
          image: library/python:3.13-alpine
          command:
            - python3
            - -c
            - |
              import time, urllib.request
              for bucket in ("loki-chunks", "loki-ruler", "loki-admin"):
                  for attempt in range(60):
                      try:
                          req = urllib.request.Request(f"http://seaweedfs:8333/{bucket}", method="PUT")
                          print(bucket, urllib.request.urlopen(req, timeout=10).status, flush=True)
                          break
                      except Exception as e:
                          print(bucket, "not yet:", e, flush=True)
                          time.sleep(5)
                  else:
                      raise SystemExit(f"could not create {bucket}")
          resources:
            requests: {cpu: 10m, memory: 32Mi}
