apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/part-of: log-flow-demo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: seaweedfs
spec:
