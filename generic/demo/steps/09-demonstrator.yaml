          volumeMounts:
            - {name: code, mountPath: /app}
            - {name: keys, mountPath: /keys, readOnly: true}
      volumes:
        - name: code
          configMap: {name: log-flow-demonstrator}
        - name: keys
          secret: {secretName: obs-gateway-keys}
