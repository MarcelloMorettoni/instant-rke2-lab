# Environment "generic": everything runs IN the cluster (docs/01, picture 08).
#   Kafka            Strimzi                      (operators chart)
#   Sign-in          Keycloak, realm obs          (Keycloak operator, operators chart)
#   Grafana's DB     PostgreSQL by the Percona operator: YOU bring it
#                    (examples/percona-postgresql.yaml); the chart copies its user Secrets
#   Secrets          generated by the chart, no Key Vault / External Secrets
#   Monitoring       a Prometheus Operator (PodMonitors + PrometheusRule)
#   Log storage      Azure Blob for now (Workload Identity, Terraform's storage
#                    account + Loki identity only). Without Azure at all: list
#                    s3-storage.yaml in overlays.txt.
# Values for BOTH charts (log-platform-operators and log-platform).

global:
  imageRegistry: ""                              # e.g. myproxy.bank.internal:5000 (then scripts/render-images.py generic)
  clusterName: aks-test-weu-01                   # k8s_cluster_name on every log line

keyVault:
  enabled: false                                 # no External Secrets; generated Secrets (both charts)

postgres:
  provider: percona
  percona:
    namespace: postgres                          # the PerconaPGCluster's namespace
    cluster: obs-pg                              # its name: Secrets obs-pg-pguser-grafana, obs-pg-pguser-keycloak
    grafanaUser: grafana
    keycloakUser: keycloak

# Kafka: on by default (chart values). Sized down for a test cluster by
# overlays/test-cluster.yaml.

keycloak:
  install: true                                  # both charts: the operator, then Keycloak + realm obs
  hostname: sso.obs-test.bank.internal           # served on Grafana's load balancer
  tls:
    selfSigned: true                             # lab; bank certificate: selfSigned false + Secret grafana/keycloak-tls
  realm:
    # Lab users, TEMPORARY password change-me-now (Keycloak asks for a new one).
    users:
      - {username: alice, groups: [obs-payments-editors]}
      - {username: bob, groups: [obs-cards-editors]}
      - {username: carol, groups: [obs-lending-editors]}
      - {username: platform, groups: [obs-platform-sre]}
    initialPassword: change-me-now
    # entraBroker: {enabled: true, tenantId: <directory id>, clientId: <app id>}   # sign in with Entra ID via Keycloak

auth:
  provider: keycloak                             # url, internalUrl and realm come from keycloak.install

grafanaAccess:
  hostname: grafana.obs-test.bank.internal
  # Internal load balancer. Not on AKS: your provider's annotations (MetalLB, ...).
  loadBalancerAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  tls:
    fromKeyVault: false
    selfSigned: true                             # lab; bank certificate: selfSigned false + Secret grafana/grafana-tls

network:
  apiServerCidrs: [10.20.0.0/28]                 # API server (VNet-integration subnet or its private IP /32)
  blobPrivateEndpointCidrs: [10.20.8.0/24]       # Blob private endpoint subnet (log storage)
  grafanaClientCidrs: [10.0.0.0/8]               # users' networks (Grafana and Keycloak)

monitoring:
  azurePodMonitors: false
  prometheusOperator:
    enabled: true                                # needs the Prometheus Operator CRDs (kube-prometheus-stack)
    namespace: monitoring
    labels: {release: kube-prometheus-stack}     # what your Prometheus selects PodMonitors/rules on

loki:
  loki:
    storage:
      azure:
        accountName: stlokitestweuxxxx           # terraform output storage_account_name
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000   # terraform output loki_client_id
  ingester:
    zoneAwareReplication:                        # the region's zone names
      zoneA: {nodeSelector: {topology.kubernetes.io/zone: westeurope-1}}
      zoneB: {nodeSelector: {topology.kubernetes.io/zone: westeurope-2}}
      zoneC: {nodeSelector: {topology.kubernetes.io/zone: westeurope-3}}

grafana:
  grafana.ini:
    server:
      root_url: https://grafana.obs-test.bank.internal
