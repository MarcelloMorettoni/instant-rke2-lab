# Tenant registry: the ONE file the platform team edits to onboard, change,
# suspend or offboard a tenant. Everything tenant-specific is generated from it:
#
#   scripts/render-tenants.py  ──►  rendered/values-tenants.yaml  (values for charts/log-platform)
#     otelAgent.alternateConfig     namespace → tenant (OTel agents)
#     otelGateway.alternateConfig   per-tenant routing + persistent queues (OTel gateway)
#     loki.loki.runtimeConfig       per-tenant limits + retention
#     readViews                     one read-gateway view per Grafana org
#     grafanaOrgs, grafanaOrgMapping  orgs, data sources, Entra group → org + role
# The cluster name is per environment: global.clusterName in environments/<env>/values.yaml.
#
# Rules (the generator enforces them):
#   - id: lowercase, [a-z][a-z0-9-]{1,39}. It is the Loki tenant ID (X-Scope-OrgID)
#     and the Grafana org name. NEVER rename it: data is stored under it.
#   - namespaces: an RE2 regex, matched against the FULL namespace name.
#     Keep tenants' regexes disjoint; `render-tenants.py --which <ns>` checks one.
#   - Namespaces that match no tenant and aren't platform go to `unassigned`,
#     which only the platform view can read. An alert fires when it gets data.
#   - status: active | suspended (collected, nobody can read) |
#             offboarding (collected if still running, retention forced to 24h, no view)

# Per-tier defaults.
#   loki:              Loki limits_config keys, applied as this tenant's overrides
#                      (https://grafana.com/docs/loki/latest/configure/#limits_config).
#                      A tenant can override any of them under `limits:`.
#   gatewayQueueMiB:   this tenant's persistent queue on EACH gateway pod: how
#                      much it can buffer while Loki is down or throttling it.
tiers:
  bronze:
    gatewayQueueMiB: 1024
    loki:
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
      max_global_streams_per_user: 5000
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 15MB
      retention_period: 744h          # 31 days
      max_query_parallelism: 32
      max_queriers_per_tenant: 4
  silver:
    gatewayQueueMiB: 2048
    loki:
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_global_streams_per_user: 15000
      per_stream_rate_limit: 5MB
      per_stream_rate_limit_burst: 20MB
      retention_period: 2160h         # 90 days
      max_query_parallelism: 64
      max_queriers_per_tenant: 8
  gold:
    gatewayQueueMiB: 4096
    loki:
      ingestion_rate_mb: 30
      ingestion_burst_size_mb: 60
      max_global_streams_per_user: 50000
      per_stream_rate_limit: 10MB
      per_stream_rate_limit_burst: 40MB
      retention_period: 9504h         # 396 days (13 months: PCI DSS 10.5.1 needs 12)
      max_query_parallelism: 128
      max_queriers_per_tenant: 12

# The platform's own tenant: AKS system namespaces and the observability stack.
platform:
  id: platform
  tier: silver
  namespaces: >-
    kube-system|kube-public|kube-node-lease|gatekeeper-system|
    calico-system|tigera-operator|app-routing-system|aks-.+|
    loki|otel|otel-agent|grafana|kgateway-system|external-secrets|cert-manager
  entraGroups:
    # Object IDs of Entra ID security groups. Editor = dashboards + Explore.
    viewer: 11111111-1111-1111-1111-111111111111   # sg-obs-platform-viewers
    editor: 22222222-2222-2222-2222-222222222222   # sg-obs-platform-sre

unassigned:
  id: unassigned
  tier: bronze

tenants:
  - id: payments
    name: Payments
    tier: gold
    status: active
    namespaces: payments(-.+)?
    entraGroups:
      viewer: 33333333-3333-3333-3333-333333333333
      editor: 44444444-4444-4444-4444-444444444444

  - id: cards
    name: Cards
    tier: gold
    status: active
    namespaces: cards(-.+)?
    # Cards' Grafana org can also read shared-services' logs (read only;
    # the data stays in shared-services). Never grant this the other way by default.
    alsoRead: [shared-services]
    entraGroups:
      viewer: 55555555-5555-5555-5555-555555555555
      editor: 66666666-6666-6666-6666-666666666666

  - id: lending
    name: Lending
    tier: silver
    status: active
    namespaces: lending(-.+)?
    limits:
      ingestion_rate_mb: 15         # month-end batch runs
    entraGroups:
      viewer: 77777777-7777-7777-7777-777777777777
      editor: 88888888-8888-8888-8888-888888888888

  - id: shared-services
    name: Shared services
    tier: silver
    status: active
    namespaces: shared-(.+)
    entraGroups:
      viewer: 99999999-9999-9999-9999-999999999999
      editor: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
